<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1387" viewBox="0 0 1440 1387"><rect width="1440" height="1387" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M6 20 Q34 9 57 24 Q83 9 111 20 V67 Q83 57 57 72 Q33 57 6 67 Z M57 24 V72 M16 35 Q35 31 47 38 M67 38 Q82 31 101 35"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">National Income, Planning and Economic Reform</text><path d="M50 175 Q210 184 372 175" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="214" font-size="26" fill="#394978" font-weight="700">APPSC Group 2 Mains Paper II  •  Indian and Andhra Pradesh Economy</text><rect x="48" y="247" width="1344" height="600" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="268" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="300" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 266) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="348" font-size="28" fill="#192644">Gross domestic product measures value added within a domestic territory with the</text><text x="84" y="386" font-size="28" fill="#192644">relevant taxes and subsidies adjustment. Gross national income adjusts the domestic</text><text x="84" y="424" font-size="28" fill="#192644">aggregate for net primary income across borders. Net measures subtract</text><text x="84" y="462" font-size="28" fill="#192644">consumption of fixed capital. Compare nominal estimates at current prices with real</text><text x="84" y="500" font-size="28" fill="#192644">estimates at constant prices. Occupational shares describe employment, while</text><text x="84" y="538" font-size="28" fill="#192644">sectoral income shares describe output. Differences can indicate productivity gaps</text><text x="84" y="576" font-size="28" fill="#192644">without directly measuring the income of every worker.</text><text x="84" y="614" font-size="28" fill="#192644">Growth is expansion of production or income. Development also concerns health,</text><text x="84" y="652" font-size="28" fill="#192644">learning, distribution and access to services. Review India&apos;s planning institutions, the</text><text x="84" y="690" font-size="28" fill="#192644">liberalisation, privatisation and global integration measures associated with 1991, and</text><text x="84" y="728" font-size="28" fill="#192644">subsequent shifts in regulation. NITI Aayog is a policy institution and platform for</text><text x="84" y="766" font-size="28" fill="#192644">cooperation with states. Financial decentralisation refers to revenue, transfers and</text><text x="84" y="804" font-size="28" fill="#192644">spending authority at different levels.</text><rect x="48" y="873" width="659" height="258" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="894" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="926" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 892) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="974" font-size="28" fill="#192644">If nominal GDP rises 10% while a</text><text x="84" y="1012" font-size="28" fill="#192644">comparable GDP deflator rises 4%,</text><text x="84" y="1050" font-size="28" fill="#192644">approximate real growth using 1.10 ÷</text><text x="84" y="1088" font-size="28" fill="#192644">1.04 − 1, about 5.8%.</text><rect x="733" y="873" width="659" height="258" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="894" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="926" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 892) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="974" font-size="28" fill="#192644">Use a constant-price series for real</text><text x="769" y="1012" font-size="28" fill="#192644">growth and check the base year before</text><text x="769" y="1050" font-size="28" fill="#192644">comparing versions.</text><rect x="48" y="1157" width="659" height="182" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="1178" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="1210" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 1176) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1258" font-size="28" fill="#192644">Which adjustment converts a gross</text><text x="84" y="1296" font-size="28" fill="#192644">aggregate to a net aggregate?</text><rect x="733" y="1157" width="659" height="182" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="1178" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="1210" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 1176) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1258" font-size="28" fill="#192644">Net national-account aggregates</text><text x="769" y="1296" font-size="28" fill="#192644">deduct consumption of fixed capital.</text></g></svg>
