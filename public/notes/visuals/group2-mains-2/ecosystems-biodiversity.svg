<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1425" viewBox="0 0 1440 1425"><rect width="1440" height="1425" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M6 20 Q34 9 57 24 Q83 9 111 20 V67 Q83 57 57 72 Q33 57 6 67 Z M57 24 V72 M16 35 Q35 31 47 38 M67 38 Q82 31 101 35"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Ecosystems, Biodiversity and Conservation</text><path d="M50 175 Q210 184 372 175" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="214" font-size="26" fill="#394978" font-weight="700">APPSC Group 2 Mains Paper II  •  Science and Technology</text><rect x="48" y="247" width="1344" height="562" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="268" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="300" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 266) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="348" font-size="28" fill="#192644">An ecosystem includes organisms and physical conditions connected by energy flow and</text><text x="84" y="386" font-size="28" fill="#192644">material cycling. Producers, consumers and decomposers perform distinct functions.</text><text x="84" y="424" font-size="28" fill="#192644">Biodiversity includes genetic, species and ecosystem diversity. Hotspots combine high</text><text x="84" y="462" font-size="28" fill="#192644">endemism with significant habitat loss under the applicable definition. Threats include</text><text x="84" y="500" font-size="28" fill="#192644">habitat change, invasive species, overexploitation, pollution and climate change.</text><text x="84" y="538" font-size="28" fill="#192644">In-situ conservation protects organisms in natural settings. Ex-situ conservation</text><text x="84" y="576" font-size="28" fill="#192644">uses settings such as seed banks and managed collections. Biosphere reserves support</text><text x="84" y="614" font-size="28" fill="#192644">conservation, sustainable use and research through zones with different functions.</text><text x="84" y="652" font-size="28" fill="#192644">CITES regulates international trade in listed species. The Convention on Biological</text><text x="84" y="690" font-size="28" fill="#192644">Diversity concerns conservation, sustainable use and fair sharing of benefits. Review</text><text x="84" y="728" font-size="28" fill="#192644">India&apos;s wildlife legislation, protected areas and dated conservation projects through</text><text x="84" y="766" font-size="28" fill="#192644">official releases.</text><rect x="48" y="835" width="659" height="296" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="856" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="888" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 854) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="936" font-size="28" fill="#192644">A protected wetland keeps species</text><text x="84" y="974" font-size="28" fill="#192644">within their habitat, an in-situ</text><text x="84" y="1012" font-size="28" fill="#192644">approach. A seed bank holds material</text><text x="84" y="1050" font-size="28" fill="#192644">away from the original habitat, an</text><text x="84" y="1088" font-size="28" fill="#192644">ex-situ approach.</text><rect x="733" y="835" width="659" height="296" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="856" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="888" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 854) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="936" font-size="28" fill="#192644">CITES listing concerns trade controls.</text><text x="769" y="974" font-size="28" fill="#192644">It is distinct from the basis of an IUCN</text><text x="769" y="1012" font-size="28" fill="#192644">risk assessment.</text><rect x="48" y="1157" width="659" height="220" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="1178" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="1210" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 1176) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1258" font-size="28" fill="#192644">Which agreement regulates</text><text x="84" y="1296" font-size="28" fill="#192644">international trade in listed wildlife</text><text x="84" y="1334" font-size="28" fill="#192644">specimens?</text><rect x="733" y="1157" width="659" height="220" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="1178" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="1210" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 1176) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1258" font-size="28" fill="#192644">CITES regulates international trade in</text><text x="769" y="1296" font-size="28" fill="#192644">specimens of listed wild fauna and</text><text x="769" y="1334" font-size="28" fill="#192644">flora.</text></g></svg>
