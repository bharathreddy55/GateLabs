<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1159" viewBox="0 0 1440 1159"><rect width="1440" height="1159" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><rect x="4" y="28" width="26" height="26" rx="5"/><rect x="46" y="12" width="26" height="26" rx="5"/><rect x="86" y="42" width="26" height="26" rx="5"/><path d="M30 33 L46 25 M71 34 L87 47 M40 24 L46 25 L44 31 M84 40 L87 47 L80 46"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Medium Access Control and Ethernet</text><path d="M50 175 Q210 184 372 175" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="214" font-size="26" fill="#394978" font-weight="700">GATE CS 2027  •  Computer Networks</text><rect x="48" y="247" width="1344" height="334" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="268" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="300" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 266) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="348" font-size="28" fill="#192644">Shared media require methods to coordinate access. Random-access protocols may</text><text x="84" y="386" font-size="28" fill="#192644">sense or contend, whereas scheduled protocols allocate opportunities. Classic shared</text><text x="84" y="424" font-size="28" fill="#192644">half-duplex Ethernet uses CSMA/CD and requires collision detection in the supported</text><text x="84" y="462" font-size="28" fill="#192644">diameter and frame-size model. Common switched full-duplex Ethernet links carry</text><text x="84" y="500" font-size="28" fill="#192644">both directions without the same collision problem. Switches learn source MAC</text><text x="84" y="538" font-size="28" fill="#192644">addresses and select forwarding ports based on destination lookup.</text><rect x="48" y="607" width="659" height="296" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="628" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="660" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 626) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="708" font-size="28" fill="#192644">A switch receives a frame from M on</text><text x="84" y="746" font-size="28" fill="#192644">port 2 and records M→2. If a later</text><text x="84" y="784" font-size="28" fill="#192644">frame on port 1 names M as destination,</text><text x="84" y="822" font-size="28" fill="#192644">a known unicast entry can limit</text><text x="84" y="860" font-size="28" fill="#192644">forwarding to port 2.</text><rect x="733" y="607" width="659" height="296" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="628" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="660" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 626) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="708" font-size="28" fill="#192644">Do not assume CSMA/CD is active on</text><text x="769" y="746" font-size="28" fill="#192644">modern full-duplex switched links.</text><text x="769" y="784" font-size="28" fill="#192644">Match the protocol behaviour to the</text><text x="769" y="822" font-size="28" fill="#192644">type of link in the question.</text><rect x="48" y="929" width="659" height="182" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="950" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="982" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 948) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1030" font-size="28" fill="#192644">What often happens to an unknown</text><text x="84" y="1068" font-size="28" fill="#192644">unicast within a VLAN?</text><rect x="733" y="929" width="659" height="182" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="950" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="982" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 948) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1030" font-size="28" fill="#192644">The switch floods it to eligible ports in</text><text x="769" y="1068" font-size="28" fill="#192644">that VLAN other than its ingress port.</text></g></svg>
