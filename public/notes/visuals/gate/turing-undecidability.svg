<title id="title">Turing Machines and Undecidability</title>
<desc id="description">Decider halts. Recogniser may loop. Reduce in the right direction</desc>
<rect width="100%" height="100%" rx="24" fill="#fcf8ef"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="28" y="43" font-size="22" fill="#5a4784">QUICK RECALL</text>
<text x="28" y="95" font-size="42" fill="#182342">Turing Machines and</text>
<text x="28" y="144" font-size="42" fill="#182342">Undecidability</text>
<rect x="28" y="165" width="225.33333333333334" height="140" rx="18" fill="#dce5ff"/><text x="140.66666666666669" y="227.66666666666666" font-size="29" fill="#344e93" text-anchor="middle">Decider</text><text x="140.66666666666669" y="261.66666666666663" font-size="29" fill="#344e93" text-anchor="middle">halts</text>
<rect x="267.33333333333337" y="165" width="225.33333333333334" height="140" rx="18" fill="#d4efe6"/><text x="380.00000000000006" y="227.66666666666666" font-size="29" fill="#20594e" text-anchor="middle">Recogniser</text><text x="380.00000000000006" y="261.66666666666663" font-size="29" fill="#20594e" text-anchor="middle">may loop</text>
<rect x="506.6666666666667" y="165" width="225.33333333333334" height="140" rx="18" fill="#fde5c5"/><text x="619.3333333333334" y="210.66666666666666" font-size="29" fill="#794718" text-anchor="middle">Reduce in</text><text x="619.3333333333334" y="244.66666666666666" font-size="29" fill="#794718" text-anchor="middle">the right</text><text x="619.3333333333334" y="278.66666666666663" font-size="29" fill="#794718" text-anchor="middle">direction</text>
