<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1121" viewBox="0 0 1440 1121"><rect width="1440" height="1121" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><rect x="4" y="28" width="26" height="26" rx="5"/><rect x="46" y="12" width="26" height="26" rx="5"/><rect x="86" y="42" width="26" height="26" rx="5"/><path d="M30 33 L46 25 M71 34 L87 47 M40 24 L46 25 L44 31 M84 40 L87 47 L80 46"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">IPv4 Fragmentation</text><path d="M50 175 Q210 184 372 175" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="214" font-size="26" fill="#394978" font-weight="700">GATE CS 2027  •  Computer Networks</text><rect x="48" y="247" width="1344" height="296" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="268" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="300" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 266) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="348" font-size="28" fill="#192644">Fragmentation may be needed when an IPv4 datagram exceeds a next-link MTU and</text><text x="84" y="386" font-size="28" fill="#192644">fragmentation is permitted. Each fragment carries an IP header and shares</text><text x="84" y="424" font-size="28" fill="#192644">identification information. The fragment offset counts units of eight payload bytes.</text><text x="84" y="462" font-size="28" fill="#192644">Except for the final fragment, payload length must be a multiple of eight. The</text><text x="84" y="500" font-size="28" fill="#192644">destination reassembles datagrams.</text><rect x="48" y="569" width="659" height="258" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="590" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="622" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 588) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="670" font-size="28" fill="#192644">With 20 bytes of header and MTU 1,500,</text><text x="84" y="708" font-size="28" fill="#192644">a nonfinal fragment can carry 1,480</text><text x="84" y="746" font-size="28" fill="#192644">payload bytes. The next fragment</text><text x="84" y="784" font-size="28" fill="#192644">offset is 1,480/8=185.</text><rect x="733" y="569" width="659" height="258" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="590" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="622" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 588) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="670" font-size="28" fill="#192644">An MTU limits total packet size, so</text><text x="769" y="708" font-size="28" fill="#192644">subtract the relevant header before</text><text x="769" y="746" font-size="28" fill="#192644">choosing fragment payload.</text><rect x="48" y="853" width="659" height="220" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="874" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="906" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 872) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="954" font-size="28" fill="#192644">What does the more-fragments flag</text><text x="84" y="992" font-size="28" fill="#192644">tell the receiver?</text><rect x="733" y="853" width="659" height="220" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="874" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="906" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 872) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="954" font-size="28" fill="#192644">It indicates that the fragment is</text><text x="769" y="992" font-size="28" fill="#192644">followed by additional data in the</text><text x="769" y="1030" font-size="28" fill="#192644">original datagram when set.</text></g></svg>
