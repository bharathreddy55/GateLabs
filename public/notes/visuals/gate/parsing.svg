<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1197" viewBox="0 0 1440 1197"><rect width="1440" height="1197" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><rect x="4" y="28" width="26" height="26" rx="5"/><rect x="46" y="12" width="26" height="26" rx="5"/><rect x="86" y="42" width="26" height="26" rx="5"/><path d="M30 33 L46 25 M71 34 L87 47 M40 24 L46 25 L44 31 M84 40 L87 47 L80 46"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Parsing — FIRST, FOLLOW, LL and LR</text><path d="M50 175 Q210 184 372 175" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="214" font-size="26" fill="#394978" font-weight="700">GATE CS 2027  •  Compiler Design</text><rect x="48" y="247" width="1344" height="296" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="268" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="300" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 266) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="348" font-size="28" fill="#192644">FIRST records which terminals can begin strings derived from a symbol sequence,</text><text x="84" y="386" font-size="28" fill="#192644">including epsilon when nullable. FOLLOW records terminals that can immediately follow</text><text x="84" y="424" font-size="28" fill="#192644">a nonterminal. LL parsers choose productions top-down with lookahead; direct left</text><text x="84" y="462" font-size="28" fill="#192644">recursion breaks naive predictive parsing. LR parsers shift tokens and reduce handles</text><text x="84" y="500" font-size="28" fill="#192644">bottom-up. Conflicts indicate competing choices in a parser table.</text><rect x="48" y="569" width="659" height="296" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="590" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="622" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 588) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="670" font-size="28" fill="#192644">A grammar A→aB | bC can choose by the</text><text x="84" y="708" font-size="28" fill="#192644">first token because FIRST sets are</text><text x="84" y="746" font-size="28" fill="#192644">disjoint. If two alternatives begin with</text><text x="84" y="784" font-size="28" fill="#192644">the same terminal, left factoring may</text><text x="84" y="822" font-size="28" fill="#192644">help.</text><rect x="733" y="569" width="659" height="296" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="590" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="622" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 588) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="670" font-size="28" fill="#192644">A conflict can reflect the parser class</text><text x="769" y="708" font-size="28" fill="#192644">or grammar, and does not always</text><text x="769" y="746" font-size="28" fill="#192644">establish that the language itself is</text><text x="769" y="784" font-size="28" fill="#192644">ambiguous.</text><rect x="48" y="891" width="659" height="258" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="912" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="944" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 910) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="992" font-size="28" fill="#192644">How do LR parsing actions differ?</text><rect x="733" y="891" width="659" height="258" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="912" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="944" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 910) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="992" font-size="28" fill="#192644">Shift consumes an input token onto the</text><text x="769" y="1030" font-size="28" fill="#192644">stack, while reduce replaces a</text><text x="769" y="1068" font-size="28" fill="#192644">recognized right-hand side by its</text><text x="769" y="1106" font-size="28" fill="#192644">left-hand nonterminal.</text></g></svg>
