<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1183" viewBox="0 0 1440 1183"><rect width="1440" height="1183" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M7 70 V11 M7 70 H110 M19 60 L44 44 L62 50 L94 22" /><circle cx="44" cy="44" r="4"/><circle cx="94" cy="22" r="4"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Transactions, Serializability and Concurrency</text><text x="48" y="212" font-size="56" fill="#182342" font-weight="700">Control</text><path d="M50 237 Q210 246 372 237" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="276" font-size="26" fill="#394978" font-weight="700">GATE CS 2027  •  Databases</text><rect x="48" y="309" width="1344" height="334" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="330" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="362" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 328) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="410" font-size="28" fill="#192644">ACID concerns atomicity, consistency, isolation and durability. Conflicting operations</text><text x="84" y="448" font-size="28" fill="#192644">are from different transactions on the same item with at least one write. A schedule</text><text x="84" y="486" font-size="28" fill="#192644">is conflict-serializable exactly when its precedence graph is acyclic. Two-phase</text><text x="84" y="524" font-size="28" fill="#192644">locking has growing and shrinking phases. Strict 2PL keeps exclusive locks until commit</text><text x="84" y="562" font-size="28" fill="#192644">or abort and protects against cascading effects from uncommitted writes. Other</text><text x="84" y="600" font-size="28" fill="#192644">methods include timestamp ordering and multiversion concurrency.</text><rect x="48" y="669" width="659" height="258" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="690" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="722" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 688) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="770" font-size="28" fill="#192644">If T1 writes X before T2 reads X, add</text><text x="84" y="808" font-size="28" fill="#192644">T1→T2. If T2 also writes Y before T1</text><text x="84" y="846" font-size="28" fill="#192644">reads Y, add T2→T1. The cycle proves the</text><text x="84" y="884" font-size="28" fill="#192644">schedule is not conflict-serializable.</text><rect x="733" y="669" width="659" height="258" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="690" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="722" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 688) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="770" font-size="28" fill="#192644">An acyclic precedence graph proves</text><text x="769" y="808" font-size="28" fill="#192644">conflict serializability. Recoverability</text><text x="769" y="846" font-size="28" fill="#192644">involves separate constraints on</text><text x="769" y="884" font-size="28" fill="#192644">dependencies and commit order.</text><rect x="48" y="953" width="659" height="182" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="974" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="1006" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 972) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1054" font-size="28" fill="#192644">What order can the precedence graph</text><text x="84" y="1092" font-size="28" fill="#192644">provide if acyclic?</text><rect x="733" y="953" width="659" height="182" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="974" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="1006" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 972) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1054" font-size="28" fill="#192644">A topological order representing a</text><text x="769" y="1092" font-size="28" fill="#192644">conflict-equivalent serial schedule.</text></g></svg>
