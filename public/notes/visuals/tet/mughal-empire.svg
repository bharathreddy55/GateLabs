<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1709" viewBox="0 0 1440 1709"><rect width="1440" height="1709" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M4 67 L33 23 L56 54 L79 11 L114 67 Z M65 37 L79 11 L93 36 M24 39 L33 23 L44 38"/><circle cx="100" cy="18" r="8"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Mughal Empire</text><path d="M50 175 Q210 184 372 175" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="214" font-size="26" fill="#394978" font-weight="700">AP TET Paper 1A  •  Environmental Studies</text><rect x="48" y="247" width="1344" height="600" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="268" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="300" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 266) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="348" font-size="28" fill="#192644">Babur&apos;s victory at Panipat in 1526 established Mughal power in northern India. Humayun</text><text x="84" y="386" font-size="28" fill="#192644">lost it temporarily to the Sur rulers and returned in 1555. Akbar built a durable</text><text x="84" y="424" font-size="28" fill="#192644">imperial administration through alliances, military expansion and revenue reform.</text><text x="84" y="462" font-size="28" fill="#192644">Mansabdars held rank, expressed through zat and sawar, and often received jagirs</text><text x="84" y="500" font-size="28" fill="#192644">whose revenue supported their obligations. The zabt system used measurement and</text><text x="84" y="538" font-size="28" fill="#192644">assessed rates in areas where such administration was practical.</text><text x="84" y="576" font-size="28" fill="#192644">Agriculture generated much of state revenue, while textiles and other crafts</text><text x="84" y="614" font-size="28" fill="#192644">connected towns with long-distance trade. Akbar&apos;s sulh-i kul expressed a policy of</text><text x="84" y="652" font-size="28" fill="#192644">broad tolerance in governance. Persian chronicles such as the Akbarnama and Ain-i</text><text x="84" y="690" font-size="28" fill="#192644">Akbari record court history and institutions. Translation projects brought Sanskrit</text><text x="84" y="728" font-size="28" fill="#192644">works into Persian, including the Mahabharata as the Razmnama. Mughal painting</text><text x="84" y="766" font-size="28" fill="#192644">developed under imperial patronage. Fatehpur Sikri, Humayun&apos;s Tomb and the Taj Mahal</text><text x="84" y="804" font-size="28" fill="#192644">illustrate different architectural phases.</text><rect x="48" y="873" width="659" height="334" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="894" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="926" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 892) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="974" font-size="28" fill="#192644">A question says an officer&apos;s rank</text><text x="84" y="1012" font-size="28" fill="#192644">includes personal status and an</text><text x="84" y="1050" font-size="28" fill="#192644">obligation to maintain cavalry. These</text><text x="84" y="1088" font-size="28" fill="#192644">are zat and sawar within mansabdari. A</text><text x="84" y="1126" font-size="28" fill="#192644">jagir is a revenue assignment used to</text><text x="84" y="1164" font-size="28" fill="#192644">support payment.</text><rect x="733" y="873" width="659" height="334" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="894" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="926" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 892) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="974" font-size="28" fill="#192644">Distinguish a mansab, which is an</text><text x="769" y="1012" font-size="28" fill="#192644">assigned rank, from a jagir, which is a</text><text x="769" y="1050" font-size="28" fill="#192644">revenue assignment.</text><rect x="48" y="1233" width="659" height="220" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="1254" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="1286" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 1252) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1334" font-size="28" fill="#192644">Which chronicle documents Akbar&apos;s</text><text x="84" y="1372" font-size="28" fill="#192644">administrative arrangements in detail?</text><rect x="733" y="1233" width="659" height="220" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="1254" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="1286" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 1252) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1334" font-size="28" fill="#192644">The Ain-i Akbari by Abu&apos;l Fazl, the</text><text x="769" y="1372" font-size="28" fill="#192644">administrative and statistical part of</text><text x="769" y="1410" font-size="28" fill="#192644">the Akbarnama project.</text><rect x="48" y="1479" width="1344" height="182" rx="23" fill="#eef2ff" stroke="#bcccf0" stroke-width="2"/><rect x="77" y="1500" width="253" height="46" rx="18" fill="#bcccf0"/><text x="93" y="1532" font-size="31" fill="#17243f" font-weight="700">Quick revision</text><g transform="translate(1306 1498) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="1580" font-size="28" fill="#192644">Akbar → consolidated administration. Abu&apos;l Fazl → Akbarnama and Ain-i Akbari. Razmnama</text><text x="84" y="1618" font-size="28" fill="#192644">→ Persian Mahabharata.</text></g></svg>
