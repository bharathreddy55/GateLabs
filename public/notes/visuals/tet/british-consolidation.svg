<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1311" viewBox="0 0 1440 1311"><rect width="1440" height="1311" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M4 67 L33 23 L56 54 L79 11 L114 67 Z M65 37 L79 11 L93 36 M24 39 L33 23 L44 38"/><circle cx="100" cy="18" r="8"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Rise and Consolidation of British Power</text><path d="M50 175 Q210 184 372 175" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="214" font-size="26" fill="#394978" font-weight="700">AP TET Paper 1A  •  Environmental Studies</text><rect x="48" y="247" width="1344" height="486" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="268" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="300" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 266) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="348" font-size="28" fill="#192644">The East India Company gained political leverage through Bengal&apos;s succession disputes,</text><text x="84" y="386" font-size="28" fill="#192644">defeated Siraj ud-Daulah at Plassey in 1757 and won at Buxar in 1764 against the</text><text x="84" y="424" font-size="28" fill="#192644">combined forces of Mir Qasim, Shuja ud-Daula and Shah Alam II. The Diwani grant of 1765</text><text x="84" y="462" font-size="28" fill="#192644">gave it revenue rights in Bengal, Bihar and Orissa. Revenue financed an army and</text><text x="84" y="500" font-size="28" fill="#192644">further expansion. Wars with Mysore, the Marathas and the Sikhs extended British</text><text x="84" y="538" font-size="28" fill="#192644">control.</text><text x="84" y="576" font-size="28" fill="#192644">Under the Subsidiary Alliance, a ruler accepted British troops and restrictions on</text><text x="84" y="614" font-size="28" fill="#192644">external relations, often paying for the force. Dalhousie&apos;s Doctrine of Lapse</text><text x="84" y="652" font-size="28" fill="#192644">facilitated annexations where the Company refused to recognize an adopted heir for</text><text x="84" y="690" font-size="28" fill="#192644">succession. Awadh was annexed in 1856 on the stated grounds of misgovernment.</text><rect x="48" y="759" width="659" height="258" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="780" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="812" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 778) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="860" font-size="28" fill="#192644">Order four events: Buxar, Diwani,</text><text x="84" y="898" font-size="28" fill="#192644">Plassey, and Awadh annexation. The</text><text x="84" y="936" font-size="28" fill="#192644">timeline is Plassey 1757 → Buxar 1764 →</text><text x="84" y="974" font-size="28" fill="#192644">Diwani 1765 → Awadh annexation 1856.</text><rect x="733" y="759" width="659" height="258" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="780" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="812" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 778) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="860" font-size="28" fill="#192644">Separate Awadh&apos;s stated annexation</text><text x="769" y="898" font-size="28" fill="#192644">grounds from the Doctrine of Lapse</text><text x="769" y="936" font-size="28" fill="#192644">used in places such as Jhansi.</text><rect x="48" y="1043" width="659" height="220" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="1064" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="1096" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 1062) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1144" font-size="28" fill="#192644">Which grant most directly expanded the</text><text x="84" y="1182" font-size="28" fill="#192644">Company&apos;s capacity to collect Bengal</text><text x="84" y="1220" font-size="28" fill="#192644">revenues?</text><rect x="733" y="1043" width="659" height="220" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="1064" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="1096" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 1062) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1144" font-size="28" fill="#192644">The Diwani grant of 1765. It gave the</text><text x="769" y="1182" font-size="28" fill="#192644">Company revenue collection rights</text><text x="769" y="1220" font-size="28" fill="#192644">after the military success at Buxar.</text></g></svg>
