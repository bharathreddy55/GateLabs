<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1747" viewBox="0 0 1440 1747"><rect width="1440" height="1747" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M4 67 L33 23 L56 54 L79 11 L114 67 Z M65 37 L79 11 L93 36 M24 39 L33 23 L44 38"/><circle cx="100" cy="18" r="8"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Vedic Age</text><path d="M50 175 Q210 184 372 175" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="214" font-size="26" fill="#394978" font-weight="700">AP TET Paper 1A  •  Environmental Studies</text><rect x="48" y="247" width="1344" height="524" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="268" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="300" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 266) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="348" font-size="28" fill="#192644">The Rigveda preserves hymns associated with the earlier Vedic period. They describe a</text><text x="84" y="386" font-size="28" fill="#192644">society in which cattle, kin groups, chiefs, warfare and ritual all mattered. The</text><text x="84" y="424" font-size="28" fill="#192644">geographical references cluster around the northwest. Later Vedic texts describe</text><text x="84" y="462" font-size="28" fill="#192644">activity extending eastward, particularly into the western Ganga–Yamuna region, with</text><text x="84" y="500" font-size="28" fill="#192644">agriculture, larger political units and increasingly elaborate sacrifices.</text><text x="84" y="538" font-size="28" fill="#192644">Compare evidence by genre. The Samhitas collect hymns or ritual formulas. The</text><text x="84" y="576" font-size="28" fill="#192644">Brahmanas explain ritual. The Aranyakas develop ritual interpretations, and the</text><text x="84" y="614" font-size="28" fill="#192644">Upanishads explore ideas including the self and ultimate reality. These categories</text><text x="84" y="652" font-size="28" fill="#192644">overlap in time and contain diverse views. Archaeology adds evidence about</text><text x="84" y="690" font-size="28" fill="#192644">settlements and technology, with correlations between particular texts and finds</text><text x="84" y="728" font-size="28" fill="#192644">treated cautiously.</text><rect x="48" y="797" width="659" height="372" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="818" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="850" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 816) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="898" font-size="28" fill="#192644">A question contrasts cattle as wealth</text><text x="84" y="936" font-size="28" fill="#192644">in hymns with royal rituals such as the</text><text x="84" y="974" font-size="28" fill="#192644">rajasuya in later texts. The first clue</text><text x="84" y="1012" font-size="28" fill="#192644">points to early Vedic priorities. The</text><text x="84" y="1050" font-size="28" fill="#192644">second illustrates how later texts</text><text x="84" y="1088" font-size="28" fill="#192644">articulate kingship and authority</text><text x="84" y="1126" font-size="28" fill="#192644">through ritual.</text><rect x="733" y="797" width="659" height="372" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="818" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="850" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 816) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="898" font-size="28" fill="#192644">Use these comparisons as changes in</text><text x="769" y="936" font-size="28" fill="#192644">emphasis. Cultivation existed in the</text><text x="769" y="974" font-size="28" fill="#192644">earlier period, and cattle retained</text><text x="769" y="1012" font-size="28" fill="#192644">value in the later period.</text><rect x="48" y="1195" width="659" height="220" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="1216" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="1248" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 1214) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1296" font-size="28" fill="#192644">Which text type is the best first</text><text x="84" y="1334" font-size="28" fill="#192644">source for explanations of sacrificial</text><text x="84" y="1372" font-size="28" fill="#192644">procedure?</text><rect x="733" y="1195" width="659" height="220" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="1216" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="1248" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 1214) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1296" font-size="28" fill="#192644">The Brahmanas, which discuss the</text><text x="769" y="1334" font-size="28" fill="#192644">meaning and performance of rituals.</text><rect x="48" y="1441" width="1344" height="258" rx="23" fill="#eef2ff" stroke="#bcccf0" stroke-width="2"/><rect x="77" y="1462" width="253" height="46" rx="18" fill="#bcccf0"/><text x="93" y="1494" font-size="31" fill="#17243f" font-weight="700">Quick revision</text><g transform="translate(1306 1460) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="1542" font-size="28" fill="#192644">- Early texts emphasize the northwest, cattle, kin groups and hymns.</text><text x="84" y="1580" font-size="28" fill="#192644">- Later texts describe an eastward shift, expanded agriculture and more elaborate</text><text x="84" y="1618" font-size="28" fill="#192644">royal rituals.</text><text x="84" y="1656" font-size="28" fill="#192644">- Brahmanas explain ritual. Upanishads explore philosophical questions.</text></g></svg>
