<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1425" viewBox="0 0 1440 1425"><rect width="1440" height="1425" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M10 58 H110 M21 58 V26 M58 58 V14 M96 58 V35"/><circle cx="21" cy="58" r="5"/><circle cx="58" cy="58" r="5"/><circle cx="96" cy="58" r="5"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Indian National Movement</text><path d="M50 175 Q210 184 372 175" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="214" font-size="26" fill="#394978" font-weight="700">AP TET Paper 1A  •  Environmental Studies</text><rect x="48" y="247" width="1344" height="562" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="268" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="300" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 266) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="348" font-size="28" fill="#192644">The Indian National Congress was founded in 1885. Early leaders used petitions and</text><text x="84" y="386" font-size="28" fill="#192644">economic criticism. Dadabhai Naoroji&apos;s drain argument traced the transfer of</text><text x="84" y="424" font-size="28" fill="#192644">resources out of India. The 1905 partition of Bengal stimulated Swadeshi and boycott.</text><text x="84" y="462" font-size="28" fill="#192644">The Home Rule leagues led by Bal Gangadhar Tilak and Annie Besant in 1916 sought</text><text x="84" y="500" font-size="28" fill="#192644">self-government, with Besant particularly active from Madras.</text><text x="84" y="538" font-size="28" fill="#192644">Gandhi&apos;s Champaran campaign in 1917 addressed indigo cultivators&apos; grievances.</text><text x="84" y="576" font-size="28" fill="#192644">Non-Cooperation began in 1920 and was withdrawn in 1922. The 1930 Salt March opened a</text><text x="84" y="614" font-size="28" fill="#192644">major phase of Civil Disobedience. In Andhra, Duggirala Gopalakrishnayya was</text><text x="84" y="652" font-size="28" fill="#192644">associated with the Chirala–Perala movement, and Alluri Sitarama Raju led the 1922–24</text><text x="84" y="690" font-size="28" fill="#192644">Rampa rebellion. Quit India began in 1942. Subhas Chandra Bose led the Indian National</text><text x="84" y="728" font-size="28" fill="#192644">Army in its later phase. These mass campaigns, local movements, wartime changes and</text><text x="84" y="766" font-size="28" fill="#192644">negotiations formed overlapping strands before independence and partition in 1947.</text><rect x="48" y="835" width="659" height="258" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="856" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="888" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 854) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="936" font-size="28" fill="#192644">Put Civil Disobedience, Swadeshi, Quit</text><text x="84" y="974" font-size="28" fill="#192644">India and Non-Cooperation in order. Use</text><text x="84" y="1012" font-size="28" fill="#192644">1905 → 1920 → 1930 → 1942.</text><rect x="733" y="835" width="659" height="258" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="856" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="888" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 854) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="936" font-size="28" fill="#192644">Keep the Rampa rebellion distinct from</text><text x="769" y="974" font-size="28" fill="#192644">the Gandhian strategy of nonviolent</text><text x="769" y="1012" font-size="28" fill="#192644">non-cooperation, even though they</text><text x="769" y="1050" font-size="28" fill="#192644">overlapped in time.</text><rect x="48" y="1119" width="659" height="258" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="1140" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="1172" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 1138) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1220" font-size="28" fill="#192644">Why was salt chosen in 1930?</text><rect x="733" y="1119" width="659" height="258" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="1140" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="1172" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 1138) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1220" font-size="28" fill="#192644">The tax and monopoly touched a basic</text><text x="769" y="1258" font-size="28" fill="#192644">everyday necessity, making salt a</text><text x="769" y="1296" font-size="28" fill="#192644">widely understood issue around which</text><text x="769" y="1334" font-size="28" fill="#192644">to mobilize civil disobedience.</text></g></svg>
