<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1595" viewBox="0 0 1440 1595"><rect width="1440" height="1595" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M4 67 L33 23 L56 54 L79 11 L114 67 Z M65 37 L79 11 L93 36 M24 39 L33 23 L44 38"/><circle cx="100" cy="18" r="8"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Delhi Sultanate</text><path d="M50 175 Q210 184 372 175" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="214" font-size="26" fill="#394978" font-weight="700">AP TET Paper 1A  •  Environmental Studies</text><rect x="48" y="247" width="1344" height="562" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="268" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="300" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 266) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="348" font-size="28" fill="#192644">The Delhi Sultanate is conventionally divided into the Mamluk, Khalji, Tughlaq, Sayyid</text><text x="84" y="386" font-size="28" fill="#192644">and Lodi dynasties, from 1206 until Babur defeated Ibrahim Lodi in 1526. Iltutmish</text><text x="84" y="424" font-size="28" fill="#192644">consolidated the Sultanate. Alauddin Khalji strengthened military and revenue</text><text x="84" y="462" font-size="28" fill="#192644">administration and employed market controls in Delhi. Muhammad bin Tughlaq&apos;s</text><text x="84" y="500" font-size="28" fill="#192644">experiments included token currency and a move toward Daulatabad.</text><text x="84" y="538" font-size="28" fill="#192644">The iqta assigned revenue from a territory to maintain officials and troops, with</text><text x="84" y="576" font-size="28" fill="#192644">administrative obligations changing over time. Cultivators, merchants and</text><text x="84" y="614" font-size="28" fill="#192644">craftspeople supported the economy, and towns linked production to courts and</text><text x="84" y="652" font-size="28" fill="#192644">markets. Persian was prominent in administration and chronicles, while regional</text><text x="84" y="690" font-size="28" fill="#192644">languages and Sanskrit continued to develop. Sufi institutions, mosques and older</text><text x="84" y="728" font-size="28" fill="#192644">religious communities shaped social life. The Qutb complex and Tughlaq tombs illustrate</text><text x="84" y="766" font-size="28" fill="#192644">distinct phases of Sultanate architecture.</text><rect x="48" y="835" width="659" height="296" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="856" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="888" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 854) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="936" font-size="28" fill="#192644">A question pairs regulated grain prices</text><text x="84" y="974" font-size="28" fill="#192644">with the maintenance of a large</text><text x="84" y="1012" font-size="28" fill="#192644">standing army. Alauddin Khalji&apos;s market</text><text x="84" y="1050" font-size="28" fill="#192644">regulations fit the pairing. Muhammad</text><text x="84" y="1088" font-size="28" fill="#192644">bin Tughlaq fits token currency.</text><rect x="733" y="835" width="659" height="296" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="856" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="888" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 854) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="936" font-size="28" fill="#192644">An iqta generally assigned revenue and</text><text x="769" y="974" font-size="28" fill="#192644">responsibilities. Distinguish it from</text><text x="769" y="1012" font-size="28" fill="#192644">unconditional ownership of the land.</text><rect x="48" y="1157" width="659" height="182" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="1178" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="1210" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 1176) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1258" font-size="28" fill="#192644">What event ended the Lodi dynasty?</text><rect x="733" y="1157" width="659" height="182" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="1178" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="1210" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 1176) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1258" font-size="28" fill="#192644">The First Battle of Panipat in 1526,</text><text x="769" y="1296" font-size="28" fill="#192644">where Babur defeated Ibrahim Lodi.</text><rect x="48" y="1365" width="1344" height="182" rx="23" fill="#eef2ff" stroke="#bcccf0" stroke-width="2"/><rect x="77" y="1386" width="253" height="46" rx="18" fill="#bcccf0"/><text x="93" y="1418" font-size="31" fill="#17243f" font-weight="700">Quick revision</text><g transform="translate(1306 1384) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="1466" font-size="28" fill="#192644">Five dynasties begin with Mamluk and end with Lodi. Persian chronicles record court</text><text x="84" y="1504" font-size="28" fill="#192644">perspectives. Match reforms to their rulers.</text></g></svg>
