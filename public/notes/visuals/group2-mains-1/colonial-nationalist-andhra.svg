<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1563" viewBox="0 0 1440 1563"><rect width="1440" height="1563" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M10 58 H110 M21 58 V26 M58 58 V14 M96 58 V35"/><circle cx="21" cy="58" r="5"/><circle cx="58" cy="58" r="5"/><circle cx="96" cy="58" r="5"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Colonial Rule, Reform and Nationalism in</text><text x="48" y="212" font-size="56" fill="#182342" font-weight="700">Andhra</text><path d="M50 237 Q210 246 372 237" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="276" font-size="26" fill="#394978" font-weight="700">APPSC Group 2 Mains Paper I  •  Social and Cultural History of Andhra Pradesh</text><rect x="48" y="309" width="1344" height="638" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="330" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="362" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 328) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="410" font-size="28" fill="#192644">European merchants used textile and maritime centres such as Masulipatnam. Company</text><text x="84" y="448" font-size="28" fill="#192644">control of the Northern Circars and its revenue administration changed regional</text><text x="84" y="486" font-size="28" fill="#192644">politics, links between cultivators and intermediaries, and access to forest</text><text x="84" y="524" font-size="28" fill="#192644">resources. Read the impact of 1857 by locality and distinguish it from later resistance</text><text x="84" y="562" font-size="28" fill="#192644">such as the Rampa uprising of 1922–24 led by Alluri Sitarama Raju.</text><text x="84" y="600" font-size="28" fill="#192644">Social reformers including Kandukuri Veeresalingam used education, publications and</text><text x="84" y="638" font-size="28" fill="#192644">associations in campaigns concerning women&apos;s education and widow remarriage.</text><text x="84" y="676" font-size="28" fill="#192644">Compare the non-Brahmin Justice Party in the Madras Presidency with the</text><text x="84" y="714" font-size="28" fill="#192644">Self-Respect movement associated with E. V. Ramasamy. Track Gandhian campaigns,</text><text x="84" y="752" font-size="28" fill="#192644">local participation such as Chirala–Perala, socialist and communist organisation, kisan</text><text x="84" y="790" font-size="28" fill="#192644">and anti-zamindari activism, and the local grievances behind each. Nationalist songs,</text><text x="84" y="828" font-size="28" fill="#192644">revolutionary writing and theatre circulated ideas beyond formal meetings. Study</text><text x="84" y="866" font-size="28" fill="#192644">women as organisers, writers and participants, including Durgabai Deshmukh&apos;s public</text><text x="84" y="904" font-size="28" fill="#192644">mobilisation and institution-building.</text><rect x="48" y="973" width="659" height="296" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="994" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="1026" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 992) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="1074" font-size="28" fill="#192644">Given a forest grievance, tribal</text><text x="84" y="1112" font-size="28" fill="#192644">mobilisation and the years 1922–24,</text><text x="84" y="1150" font-size="28" fill="#192644">identify the Rampa uprising. A different</text><text x="84" y="1188" font-size="28" fill="#192644">question about Chirala–Perala asks</text><text x="84" y="1226" font-size="28" fill="#192644">about a civic and tax protest.</text><rect x="733" y="973" width="659" height="296" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="994" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="1026" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 992) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="1074" font-size="28" fill="#192644">Chronology matters. Reform</text><text x="769" y="1112" font-size="28" fill="#192644">associations, peasant mobilisation and</text><text x="769" y="1150" font-size="28" fill="#192644">the Congress campaigns often</text><text x="769" y="1188" font-size="28" fill="#192644">overlapped, with different aims.</text><rect x="48" y="1295" width="659" height="220" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="1316" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="1348" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 1314) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1396" font-size="28" fill="#192644">Which reformer is closely associated</text><text x="84" y="1434" font-size="28" fill="#192644">with widow remarriage advocacy in</text><text x="84" y="1472" font-size="28" fill="#192644">Andhra?</text><rect x="733" y="1295" width="659" height="220" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="1316" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="1348" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 1314) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1396" font-size="28" fill="#192644">Veeresalingam campaigned for widow</text><text x="769" y="1434" font-size="28" fill="#192644">remarriage and women&apos;s education in</text><text x="769" y="1472" font-size="28" fill="#192644">the Telugu-speaking region.</text></g></svg>
