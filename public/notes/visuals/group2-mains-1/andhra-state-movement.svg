<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1411" viewBox="0 0 1440 1411"><rect width="1440" height="1411" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M10 58 H110 M21 58 V26 M58 58 V14 M96 58 V35"/><circle cx="21" cy="58" r="5"/><circle cx="58" cy="58" r="5"/><circle cx="96" cy="58" r="5"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Andhra Movement and the Formation of</text><text x="48" y="212" font-size="56" fill="#182342" font-weight="700">Andhra State</text><path d="M50 237 Q210 246 372 237" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="276" font-size="26" fill="#394978" font-weight="700">APPSC Group 2 Mains Paper I  •  Social and Cultural History of Andhra Pradesh</text><rect x="48" y="309" width="1344" height="562" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="330" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="362" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 328) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="410" font-size="28" fill="#192644">The demand for a separate Andhra province developed around language, political</text><text x="84" y="448" font-size="28" fill="#192644">representation, educational institutions and administration in the Madras Presidency.</text><text x="84" y="486" font-size="28" fill="#192644">Follow the Andhra conferences and Mahasabhas, Telugu newspapers, public associations</text><text x="84" y="524" font-size="28" fill="#192644">and leaders such as Konda Venkatappayya and Tanguturi Prakasam. Libraries and</text><text x="84" y="562" font-size="28" fill="#192644">reading rooms helped circulate ideas and build local organisation. Folk performance,</text><text x="84" y="600" font-size="28" fill="#192644">songs and tribal traditions were important parts of a culturally diverse region and</text><text x="84" y="638" font-size="28" fill="#192644">should be studied through specific communities, places and historical settings.</text><text x="84" y="676" font-size="28" fill="#192644">Potti Sriramulu&apos;s fast and death in 1952 accelerated the separate state demand.</text><text x="84" y="714" font-size="28" fill="#192644">Parliament passed the Andhra State Act in 1953, and Andhra State was inaugurated on 1</text><text x="84" y="752" font-size="28" fill="#192644">October 1953 with Kurnool as its capital. Tanguturi Prakasam served as the first chief</text><text x="84" y="790" font-size="28" fill="#192644">minister. Keep the Andhra movement in the Madras Presidency distinct from similarly</text><text x="84" y="828" font-size="28" fill="#192644">named organisations and movements in the former Hyderabad State.</text><rect x="48" y="897" width="659" height="258" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="918" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="950" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 916) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="998" font-size="28" fill="#192644">A chronology item places the fast and</text><text x="84" y="1036" font-size="28" fill="#192644">Andhra State Act next to Andhra</text><text x="84" y="1074" font-size="28" fill="#192644">Pradesh formation. Order them 1952,</text><text x="84" y="1112" font-size="28" fill="#192644">1953 and 1956.</text><rect x="733" y="897" width="659" height="258" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="918" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="950" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 916) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="998" font-size="28" fill="#192644">The Andhra State created in 1953 and</text><text x="769" y="1036" font-size="28" fill="#192644">the Andhra Pradesh formed in 1956 were</text><text x="769" y="1074" font-size="28" fill="#192644">distinct territorial arrangements.</text><rect x="48" y="1181" width="659" height="182" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="1202" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="1234" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 1200) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1282" font-size="28" fill="#192644">Which city was the capital of Andhra</text><text x="84" y="1320" font-size="28" fill="#192644">State at its formation in 1953?</text><rect x="733" y="1181" width="659" height="182" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="1202" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="1234" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 1200) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1282" font-size="28" fill="#192644">Kurnool was the capital of the Andhra</text><text x="769" y="1320" font-size="28" fill="#192644">State inaugurated in October 1953.</text></g></svg>
