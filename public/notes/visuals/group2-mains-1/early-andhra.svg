<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1463" viewBox="0 0 1440 1463"><rect width="1440" height="1463" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M10 58 H110 M21 58 V26 M58 58 V14 M96 58 V35"/><circle cx="21" cy="58" r="5"/><circle cx="58" cy="58" r="5"/><circle cx="96" cy="58" r="5"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Early Andhra and the Vengi Dynasties</text><path d="M50 175 Q210 184 372 175" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="214" font-size="26" fill="#394978" font-weight="700">APPSC Group 2 Mains Paper I  •  Social and Cultural History of Andhra Pradesh</text><rect x="48" y="247" width="1344" height="600" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="268" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="300" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 266) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="348" font-size="28" fill="#192644">Early Andhra archaeology records diverse livelihoods before large states formed.</text><text x="84" y="386" font-size="28" fill="#192644">Compare stone tools and settlement evidence with Iron Age megalithic burials. Burials</text><text x="84" y="424" font-size="28" fill="#192644">reveal material culture and mortuary practices, while inscriptions and coins become</text><text x="84" y="462" font-size="28" fill="#192644">especially important for studying early dynasties.</text><text x="84" y="500" font-size="28" fill="#192644">The Satavahanas ruled across parts of the Deccan, and trade and religious gifts</text><text x="84" y="538" font-size="28" fill="#192644">connected routes, settlements and Buddhist establishments. Read Amaravati&apos;s stupa</text><text x="84" y="576" font-size="28" fill="#192644">reliefs as material evidence of patronage and narrative art across several periods. At</text><text x="84" y="614" font-size="28" fill="#192644">Nagarjunakonda, inscriptions and remains illuminate Ikshvaku rule, Buddhist</text><text x="84" y="652" font-size="28" fill="#192644">establishments and royal and non-royal donors. Prakrit appears prominently in early</text><text x="84" y="690" font-size="28" fill="#192644">inscriptions. Later Vishnukundin, Eastern Chalukya and local Chola records show</text><text x="84" y="728" font-size="28" fill="#192644">changing administration, temple patronage and linguistic practice. Associate Nannaya&apos;s</text><text x="84" y="766" font-size="28" fill="#192644">Telugu Mahabharata with the Eastern Chalukya court of Rajaraja Narendra. The Renati</text><text x="84" y="804" font-size="28" fill="#192644">Cholas are important in the study of early Telugu inscriptions.</text><rect x="48" y="873" width="659" height="296" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="894" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="926" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 892) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="974" font-size="28" fill="#192644">A question combines a stupa at</text><text x="84" y="1012" font-size="28" fill="#192644">Amaravati with an inscription at</text><text x="84" y="1050" font-size="28" fill="#192644">Nagarjunakonda. First identify the site</text><text x="84" y="1088" font-size="28" fill="#192644">and associated evidence, then connect</text><text x="84" y="1126" font-size="28" fill="#192644">the latter to Ikshvaku patronage.</text><rect x="733" y="873" width="659" height="296" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="894" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="926" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 892) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="974" font-size="28" fill="#192644">Study dynastic chronology and site</text><text x="769" y="1012" font-size="28" fill="#192644">history separately. A monument can</text><text x="769" y="1050" font-size="28" fill="#192644">have several phases and donors.</text><rect x="48" y="1195" width="659" height="220" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="1216" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="1248" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 1214) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1296" font-size="28" fill="#192644">Which court is associated with</text><text x="84" y="1334" font-size="28" fill="#192644">Nannaya’s Telugu Mahabharata?</text><rect x="733" y="1195" width="659" height="220" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="1216" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="1248" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 1214) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1296" font-size="28" fill="#192644">Nannaya worked under the patronage of</text><text x="769" y="1334" font-size="28" fill="#192644">Rajaraja Narendra of the Eastern</text><text x="769" y="1372" font-size="28" fill="#192644">Chalukya line.</text></g></svg>
