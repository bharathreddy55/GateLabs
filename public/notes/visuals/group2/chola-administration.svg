<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1557" viewBox="0 0 1440 1557"><rect width="1440" height="1557" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M10 58 H110 M21 58 V26 M58 58 V14 M96 58 V35"/><circle cx="21" cy="58" r="5"/><circle cx="58" cy="58" r="5"/><circle cx="96" cy="58" r="5"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Chola Administrative System</text><path d="M50 175 Q210 184 372 175" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="214" font-size="26" fill="#394978" font-weight="700">APPSC Group 2 Prelims  •  Indian History</text><rect x="48" y="247" width="1344" height="486" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="268" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="300" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 266) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="348" font-size="28" fill="#192644">The Cholas governed through a hierarchy often described as mandalam, valanadu, nadu</text><text x="84" y="386" font-size="28" fill="#192644">and village. Revenue depended heavily on land and its assessment. Canals and tanks</text><text x="84" y="424" font-size="28" fill="#192644">supported cultivation in the Kaveri delta. Under Rajaraja I and Rajendra I the kingdom</text><text x="84" y="462" font-size="28" fill="#192644">expanded overseas and across parts of southern India. Temples received land and gifts</text><text x="84" y="500" font-size="28" fill="#192644">and acted as centres of worship, employment and economic activity.</text><text x="84" y="538" font-size="28" fill="#192644">Inscriptions distinguish the ur of ordinary villages, the sabha of Brahmana</text><text x="84" y="576" font-size="28" fill="#192644">settlements and the nagaram associated with merchants. Uttaramerur records set</text><text x="84" y="614" font-size="28" fill="#192644">eligibility and disqualification rules for members of committees that handled local</text><text x="84" y="652" font-size="28" fill="#192644">functions. The kudavolai process involved drawing names from a pot among eligible</text><text x="84" y="690" font-size="28" fill="#192644">candidates. The records document particular institutions and settlements.</text><rect x="48" y="759" width="659" height="296" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="780" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="812" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 778) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="860" font-size="28" fill="#192644">A question asks which body managed a</text><text x="84" y="898" font-size="28" fill="#192644">Brahmadeya village through</text><text x="84" y="936" font-size="28" fill="#192644">committees. Pick the sabha. If the clue</text><text x="84" y="974" font-size="28" fill="#192644">concerns a merchant organization, look</text><text x="84" y="1012" font-size="28" fill="#192644">for nagaram.</text><rect x="733" y="759" width="659" height="296" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="780" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="812" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 778) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="860" font-size="28" fill="#192644">Avoid treating the Uttaramerur</text><text x="769" y="898" font-size="28" fill="#192644">selection rules as universal adult</text><text x="769" y="936" font-size="28" fill="#192644">voting. Participation was subject to</text><text x="769" y="974" font-size="28" fill="#192644">qualifications specified in the</text><text x="769" y="1012" font-size="28" fill="#192644">inscriptions.</text><rect x="48" y="1081" width="659" height="220" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="1102" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="1134" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 1100) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1182" font-size="28" fill="#192644">What is the chief evidence for</text><text x="84" y="1220" font-size="28" fill="#192644">committee selection at Uttaramerur?</text><rect x="733" y="1081" width="659" height="220" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="1102" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="1134" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 1100) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1182" font-size="28" fill="#192644">Inscriptions recording selection</text><text x="769" y="1220" font-size="28" fill="#192644">procedures, qualifications and grounds</text><text x="769" y="1258" font-size="28" fill="#192644">for disqualification.</text><rect x="48" y="1327" width="1344" height="182" rx="23" fill="#eef2ff" stroke="#bcccf0" stroke-width="2"/><rect x="77" y="1348" width="253" height="46" rx="18" fill="#bcccf0"/><text x="93" y="1380" font-size="31" fill="#17243f" font-weight="700">Quick revision</text><g transform="translate(1306 1346) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="1428" font-size="28" fill="#192644">Mandalam → province. Sabha → Brahmana village assembly. Kudavolai → pot selection</text><text x="84" y="1466" font-size="28" fill="#192644">from eligible candidates.</text></g></svg>
