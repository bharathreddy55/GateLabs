<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1525" viewBox="0 0 1440 1525"><rect width="1440" height="1525" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M10 58 H110 M21 58 V26 M58 58 V14 M96 58 V35"/><circle cx="21" cy="58" r="5"/><circle cx="58" cy="58" r="5"/><circle cx="96" cy="58" r="5"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">International Current Affairs — November</text><text x="48" y="212" font-size="56" fill="#182342" font-weight="700">2026</text><path d="M50 237 Q210 246 372 237" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="276" font-size="26" fill="#394978" font-weight="700">APPSC Group 2 Prelims  •  Current Affairs</text><rect x="48" y="309" width="1344" height="562" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="330" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="362" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 328) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="410" font-size="28" fill="#192644">Coverage: selected international event, 9–18 November 2026. Information checked on 18</text><text x="84" y="448" font-size="28" fill="#192644">November 2026.</text><text x="84" y="486" font-size="28" fill="#192644">The UN climate conference COP31 is scheduled for 9–20 November in Antalya, Türkiye.</text><text x="84" y="524" font-size="28" fill="#192644">The opening of the first high-level segment took place on 11 November. The UNFCCC</text><text x="84" y="562" font-size="28" fill="#192644">organizes the conference. COP refers to the Conference of the Parties to the climate</text><text x="84" y="600" font-size="28" fill="#192644">convention. CMP refers to the meeting of parties to the Kyoto Protocol, and CMA to</text><text x="84" y="638" font-size="28" fill="#192644">the meeting of parties to the Paris Agreement. Those bodies can meet during the same</text><text x="84" y="676" font-size="28" fill="#192644">conference and adopt texts under separate legal frameworks.</text><text x="84" y="714" font-size="28" fill="#192644">The agenda connects emissions reduction, adaptation and finance. Mitigation reduces</text><text x="84" y="752" font-size="28" fill="#192644">greenhouse-gas emissions or increases removals. Adaptation reduces harm from</text><text x="84" y="790" font-size="28" fill="#192644">climate impacts. Finance can support either objective, depending on how funds are</text><text x="84" y="828" font-size="28" fill="#192644">used.</text><rect x="48" y="897" width="659" height="334" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="918" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="950" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 916) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="998" font-size="28" fill="#192644">A coastal early-warning system helps</text><text x="84" y="1036" font-size="28" fill="#192644">communities prepare for storm surge.</text><text x="84" y="1074" font-size="28" fill="#192644">Classify it as adaptation. Replacing a</text><text x="84" y="1112" font-size="28" fill="#192644">fossil generation source with</text><text x="84" y="1150" font-size="28" fill="#192644">lower-carbon energy is primarily</text><text x="84" y="1188" font-size="28" fill="#192644">mitigation.</text><rect x="733" y="897" width="659" height="334" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="918" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="950" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 916) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="998" font-size="28" fill="#192644">The hosts&apos; programme and speeches</text><text x="769" y="1036" font-size="28" fill="#192644">indicate priorities and proposals. Use</text><text x="769" y="1074" font-size="28" fill="#192644">the relevant adopted decision text for</text><text x="769" y="1112" font-size="28" fill="#192644">claims about negotiated outcomes.</text><rect x="48" y="1257" width="659" height="220" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="1278" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="1310" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 1276) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1358" font-size="28" fill="#192644">Which meeting body deals with the Paris</text><text x="84" y="1396" font-size="28" fill="#192644">Agreement?</text><rect x="733" y="1257" width="659" height="220" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="1278" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="1310" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 1276) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1358" font-size="28" fill="#192644">The CMA. The reference to the Paris</text><text x="769" y="1396" font-size="28" fill="#192644">Agreement identifies the governing</text><text x="769" y="1434" font-size="28" fill="#192644">instrument.</text></g></svg>
