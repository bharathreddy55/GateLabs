<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1273" viewBox="0 0 1440 1273"><rect width="1440" height="1273" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M4 67 L33 23 L56 54 L79 11 L114 67 Z M65 37 L79 11 L93 36 M24 39 L33 23 L44 38"/><circle cx="100" cy="18" r="8"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Urbanisation and Settlements</text><path d="M50 175 Q210 184 372 175" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="214" font-size="26" fill="#394978" font-weight="700">APPSC Group 2 Prelims  •  Geography</text><rect x="48" y="247" width="1344" height="372" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="268" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="300" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 266) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="348" font-size="28" fill="#192644">Urbanisation means a rising share of people living in urban settlements. It can result</text><text x="84" y="386" font-size="28" fill="#192644">from net rural-to-urban migration, differences in natural increase, reclassification</text><text x="84" y="424" font-size="28" fill="#192644">and incorporation of nearby settlements. Indian urban statistics distinguish statutory</text><text x="84" y="462" font-size="28" fill="#192644">towns, officially designated as urban, from census towns identified by census</text><text x="84" y="500" font-size="28" fill="#192644">criteria. Visakhapatnam and the Vijayawada–Guntur area illustrate different urban</text><text x="84" y="538" font-size="28" fill="#192644">functions in Andhra Pradesh, including port industry, commerce, services and</text><text x="84" y="576" font-size="28" fill="#192644">administration.</text><rect x="48" y="645" width="659" height="334" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="666" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="698" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 664) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="746" font-size="28" fill="#192644">If the urban population rises from 20 to</text><text x="84" y="784" font-size="28" fill="#192644">22 million while the total rises from 50</text><text x="84" y="822" font-size="28" fill="#192644">to 60 million, the urban share falls</text><text x="84" y="860" font-size="28" fill="#192644">from 40% to about 36.7%. Urban</text><text x="84" y="898" font-size="28" fill="#192644">population grew, while the urbanisation</text><text x="84" y="936" font-size="28" fill="#192644">share declined.</text><rect x="733" y="645" width="659" height="334" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="666" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="698" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 664) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="746" font-size="28" fill="#192644">A larger urban population and a larger</text><text x="769" y="784" font-size="28" fill="#192644">urban share measure different</text><text x="769" y="822" font-size="28" fill="#192644">outcomes.</text><rect x="48" y="1005" width="659" height="220" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="1026" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="1058" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 1024) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1106" font-size="28" fill="#192644">How can reclassification increase</text><text x="84" y="1144" font-size="28" fill="#192644">urbanisation without individuals</text><text x="84" y="1182" font-size="28" fill="#192644">changing homes?</text><rect x="733" y="1005" width="659" height="220" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="1026" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="1058" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 1024) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1106" font-size="28" fill="#192644">Residents of a newly classified urban</text><text x="769" y="1144" font-size="28" fill="#192644">settlement enter the urban count at</text><text x="769" y="1182" font-size="28" fill="#192644">the same address.</text></g></svg>
