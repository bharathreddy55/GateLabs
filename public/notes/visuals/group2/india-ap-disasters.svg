<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1539" viewBox="0 0 1440 1539"><rect width="1440" height="1539" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M4 67 L33 23 L56 54 L79 11 L114 67 Z M65 37 L79 11 L93 36 M24 39 L33 23 L44 38"/><circle cx="100" cy="18" r="8"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Natural Hazards and Disaster Management</text><path d="M50 175 Q210 184 372 175" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="214" font-size="26" fill="#394978" font-weight="700">APPSC Group 2 Prelims  •  Geography</text><rect x="48" y="247" width="1344" height="562" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="268" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="300" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 266) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="348" font-size="28" fill="#192644">A hazard is a potentially damaging event or process. Exposure describes people and</text><text x="84" y="386" font-size="28" fill="#192644">assets in harm&apos;s way, and vulnerability describes their susceptibility to loss. Disaster</text><text x="84" y="424" font-size="28" fill="#192644">risk also depends on capacity to prepare and respond. Mitigation reduces risk before</text><text x="84" y="462" font-size="28" fill="#192644">events, preparedness organizes early warnings and action, response addresses</text><text x="84" y="500" font-size="28" fill="#192644">immediate needs, and recovery restores services and livelihoods.</text><text x="84" y="538" font-size="28" fill="#192644">In India, examples include Himalayan earthquakes and landslides, river floods, heat</text><text x="84" y="576" font-size="28" fill="#192644">waves, drought and coastal cyclones. Andhra Pradesh faces Bay of Bengal cyclones and</text><text x="84" y="614" font-size="28" fill="#192644">storm surge, flooding in rivers and low-lying settlements, and recurring heat and</text><text x="84" y="652" font-size="28" fill="#192644">rainfall deficits in the interior. Forecasts from IMD and local alerts should lead to</text><text x="84" y="690" font-size="28" fill="#192644">specific decisions such as evacuation of vulnerable coastal areas, emergency shelter</text><text x="84" y="728" font-size="28" fill="#192644">operations or heat action measures. Urban flood planning includes drainage capacity,</text><text x="84" y="766" font-size="28" fill="#192644">floodplain management and maintenance.</text><rect x="48" y="835" width="659" height="372" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="856" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="888" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 854) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="936" font-size="28" fill="#192644">A cyclone warning predicts high surge</text><text x="84" y="974" font-size="28" fill="#192644">for a low-lying village. Moving</text><text x="84" y="1012" font-size="28" fill="#192644">residents to designated higher shelters</text><text x="84" y="1050" font-size="28" fill="#192644">is preparedness and immediate</text><text x="84" y="1088" font-size="28" fill="#192644">protective action. Building shelters and</text><text x="84" y="1126" font-size="28" fill="#192644">restricting critical infrastructure in</text><text x="84" y="1164" font-size="28" fill="#192644">surge zones reduce long-term risk.</text><rect x="733" y="835" width="659" height="372" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="856" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="888" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 854) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="936" font-size="28" fill="#192644">Storm surge is abnormal sea-level rise</text><text x="769" y="974" font-size="28" fill="#192644">driven by a storm, with actual coastal</text><text x="769" y="1012" font-size="28" fill="#192644">inundation also affected by the tide,</text><text x="769" y="1050" font-size="28" fill="#192644">waves and local topography.</text><rect x="48" y="1233" width="659" height="258" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="1254" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="1286" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 1252) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1334" font-size="28" fill="#192644">Why can storms of comparable wind</text><text x="84" y="1372" font-size="28" fill="#192644">intensity cause different losses?</text><rect x="733" y="1233" width="659" height="258" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="1254" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="1286" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 1252) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1334" font-size="28" fill="#192644">Exposure, surge, rainfall, local</text><text x="769" y="1372" font-size="28" fill="#192644">geography, building strength, warning</text><text x="769" y="1410" font-size="28" fill="#192644">lead time and evacuation capacity</text><text x="769" y="1448" font-size="28" fill="#192644">differ.</text></g></svg>
