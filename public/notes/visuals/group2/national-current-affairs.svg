<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1539" viewBox="0 0 1440 1539"><rect width="1440" height="1539" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M10 58 H110 M21 58 V26 M58 58 V14 M96 58 V35"/><circle cx="21" cy="58" r="5"/><circle cx="58" cy="58" r="5"/><circle cx="96" cy="58" r="5"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">National Current Affairs — November 2026</text><path d="M50 175 Q210 184 372 175" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="214" font-size="26" fill="#394978" font-weight="700">APPSC Group 2 Prelims  •  Current Affairs</text><rect x="48" y="247" width="1344" height="562" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="268" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="300" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 266) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="348" font-size="28" fill="#192644">Coverage: selected Union Cabinet decisions on 4 and 11 November 2026. Information</text><text x="84" y="386" font-size="28" fill="#192644">checked on 18 November 2026.</text><text x="84" y="424" font-size="28" fill="#192644">On 4 November, the Union Cabinet approved Viksit Bharat Initiative for Statistical</text><text x="84" y="462" font-size="28" fill="#192644">Transformation, Analytics &amp; Research, or VISTAR. PIB lists it as a central sector</text><text x="84" y="500" font-size="28" fill="#192644">scheme running from 2026–27 to 2030–31. This is useful for questions about statistical</text><text x="84" y="538" font-size="28" fill="#192644">capacity and evidence-based policy. PIB also lists the Cabinet approving viability-gap</text><text x="84" y="576" font-size="28" fill="#192644">funding for 92 GWh of grid-scale energy storage. Viability-gap support helps bridge a</text><text x="84" y="614" font-size="28" fill="#192644">financial shortfall on projects with wider public value.</text><text x="84" y="652" font-size="28" fill="#192644">On 11 November, the Cabinet approved nutrient-based subsidy rates for phosphatic and</text><text x="84" y="690" font-size="28" fill="#192644">potassic fertilizers for the 2026–27 rabi season, covering 1 October 2026 through 31</text><text x="84" y="728" font-size="28" fill="#192644">March 2027. Learning the scope of the rate decision helps distinguish the nutrients</text><text x="84" y="766" font-size="28" fill="#192644">covered, the policy period and a particular fertilizer product&apos;s retail price.</text><rect x="48" y="835" width="659" height="410" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="856" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="888" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 854) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="936" font-size="28" fill="#192644">Compare 92 GWh of storage and a grid</text><text x="84" y="974" font-size="28" fill="#192644">connection rated in MW. GWh expresses</text><text x="84" y="1012" font-size="28" fill="#192644">energy stored or delivered over a</text><text x="84" y="1050" font-size="28" fill="#192644">period. MW expresses the rate of</text><text x="84" y="1088" font-size="28" fill="#192644">power transfer at a moment. A battery</text><text x="84" y="1126" font-size="28" fill="#192644">rated at 100 MW and 400 MWh can</text><text x="84" y="1164" font-size="28" fill="#192644">nominally deliver full rated power for</text><text x="84" y="1202" font-size="28" fill="#192644">four hours.</text><rect x="733" y="835" width="659" height="410" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="856" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="888" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 854) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="936" font-size="28" fill="#192644">An approval date and the period it</text><text x="769" y="974" font-size="28" fill="#192644">governs can differ. Keep the November</text><text x="769" y="1012" font-size="28" fill="#192644">announcement and October start of the</text><text x="769" y="1050" font-size="28" fill="#192644">cited rabi period separate.</text><rect x="48" y="1271" width="659" height="220" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="1292" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="1324" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 1290) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1372" font-size="28" fill="#192644">What is the policy focus indicated by</text><text x="84" y="1410" font-size="28" fill="#192644">the title VISTAR?</text><rect x="733" y="1271" width="659" height="220" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="1292" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="1324" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 1290) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1372" font-size="28" fill="#192644">Statistical transformation, analytics</text><text x="769" y="1410" font-size="28" fill="#192644">and research. The acronym is linked to</text><text x="769" y="1448" font-size="28" fill="#192644">data and policy evidence.</text></g></svg>
