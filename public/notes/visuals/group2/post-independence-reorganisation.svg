<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1449" viewBox="0 0 1440 1449"><rect width="1440" height="1449" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M10 58 H110 M21 58 V26 M58 58 V14 M96 58 V35"/><circle cx="21" cy="58" r="5"/><circle cx="58" cy="58" r="5"/><circle cx="96" cy="58" r="5"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Post-Independence Integration and</text><text x="48" y="212" font-size="56" fill="#182342" font-weight="700">Reorganisation</text><path d="M50 237 Q210 246 372 237" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="276" font-size="26" fill="#394978" font-weight="700">APPSC Group 2 Prelims  •  Indian History</text><rect x="48" y="309" width="1344" height="562" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="330" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="362" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 328) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="410" font-size="28" fill="#192644">At independence, British paramountcy over princely states lapsed. Vallabhbhai Patel</text><text x="84" y="448" font-size="28" fill="#192644">and V. P. Menon helped negotiate accession and integration. Junagadh, Hyderabad and</text><text x="84" y="486" font-size="28" fill="#192644">Jammu and Kashmir followed different paths. Hyderabad was incorporated after</text><text x="84" y="524" font-size="28" fill="#192644">Operation Polo in 1948. The Constitution took effect on 26 January 1950 and provided a</text><text x="84" y="562" font-size="28" fill="#192644">framework for the Union and states.</text><text x="84" y="600" font-size="28" fill="#192644">After Potti Sriramulu&apos;s fast and death in 1952 and the ensuing movement, Andhra State</text><text x="84" y="638" font-size="28" fill="#192644">was created from Madras State on 1 October 1953. The States Reorganisation</text><text x="84" y="676" font-size="28" fill="#192644">Commission examined language alongside administrative and economic considerations.</text><text x="84" y="714" font-size="28" fill="#192644">The States Reorganisation Act of 1956 reshaped boundaries. Andhra State merged with</text><text x="84" y="752" font-size="28" fill="#192644">the Telangana region of Hyderabad State to form Andhra Pradesh on 1 November 1956.</text><text x="84" y="790" font-size="28" fill="#192644">Under the Andhra Pradesh Reorganisation Act, Telangana became a separate state on 2</text><text x="84" y="828" font-size="28" fill="#192644">June 2014.</text><rect x="48" y="897" width="659" height="296" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="918" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="950" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 916) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="998" font-size="28" fill="#192644">A question asks whether Andhra</text><text x="84" y="1036" font-size="28" fill="#192644">Pradesh was formed in 1953 or 1956.</text><text x="84" y="1074" font-size="28" fill="#192644">Andhra State was created in 1953.</text><text x="84" y="1112" font-size="28" fill="#192644">Andhra Pradesh followed when</text><text x="84" y="1150" font-size="28" fill="#192644">Telangana joined it in 1956.</text><rect x="733" y="897" width="659" height="296" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="918" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="950" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 916) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="998" font-size="28" fill="#192644">Separate princely-state accession,</text><text x="769" y="1036" font-size="28" fill="#192644">linguistic reorganisation and the 2014</text><text x="769" y="1074" font-size="28" fill="#192644">bifurcation. Each involved different</text><text x="769" y="1112" font-size="28" fill="#192644">institutions and dates.</text><rect x="48" y="1219" width="659" height="182" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="1240" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="1272" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 1238) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1320" font-size="28" fill="#192644">Which law created the separate state</text><text x="84" y="1358" font-size="28" fill="#192644">of Telangana?</text><rect x="733" y="1219" width="659" height="182" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="1240" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="1272" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 1238) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1320" font-size="28" fill="#192644">The Andhra Pradesh Reorganisation Act,</text><text x="769" y="1358" font-size="28" fill="#192644">2014. The appointed day was 2 June 2014.</text></g></svg>
