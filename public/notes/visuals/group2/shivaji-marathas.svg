<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1557" viewBox="0 0 1440 1557"><rect width="1440" height="1557" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M10 58 H110 M21 58 V26 M58 58 V14 M96 58 V35"/><circle cx="21" cy="58" r="5"/><circle cx="58" cy="58" r="5"/><circle cx="96" cy="58" r="5"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Shivaji and the Rise of the Marathas</text><path d="M50 175 Q210 184 372 175" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="214" font-size="26" fill="#394978" font-weight="700">APPSC Group 2 Prelims  •  Indian History</text><rect x="48" y="247" width="1344" height="524" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="268" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="300" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 266) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="348" font-size="28" fill="#192644">Shivaji built a kingdom in the western Deccan from a network of forts, mobile forces</text><text x="84" y="386" font-size="28" fill="#192644">and local alliances. The terrain of the Sahyadris helped fort defence and rapid troop</text><text x="84" y="424" font-size="28" fill="#192644">movement. His conflicts with Bijapur and the Mughals included the Treaty of Purandar</text><text x="84" y="462" font-size="28" fill="#192644">in 1665. He was crowned at Raigad in 1674 and supported a naval presence along the</text><text x="84" y="500" font-size="28" fill="#192644">western coast.</text><text x="84" y="538" font-size="28" fill="#192644">The Ashtapradhan comprised eight senior offices. The Peshwa was a chief minister in</text><text x="84" y="576" font-size="28" fill="#192644">Shivaji&apos;s administration and later became more powerful under his successors. Chauth</text><text x="84" y="614" font-size="28" fill="#192644">was a quarter levy, and sardeshmukhi referred to an additional claim commonly</text><text x="84" y="652" font-size="28" fill="#192644">described as one tenth. In the eighteenth century, Peshwas and regional Maratha</text><text x="84" y="690" font-size="28" fill="#192644">houses extended power far beyond the original kingdom. The 1761 defeat at Panipat</text><text x="84" y="728" font-size="28" fill="#192644">occurred in this later phase.</text><rect x="48" y="797" width="659" height="296" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="818" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="850" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 816) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="898" font-size="28" fill="#192644">An item links Raigad and 1674 with an</text><text x="84" y="936" font-size="28" fill="#192644">assertion of sovereign rule. The event</text><text x="84" y="974" font-size="28" fill="#192644">is Shivaji&apos;s coronation. A question</text><text x="84" y="1012" font-size="28" fill="#192644">linking Peshwa dominance and Panipat in</text><text x="84" y="1050" font-size="28" fill="#192644">1761 refers to later Maratha history.</text><rect x="733" y="797" width="659" height="296" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="818" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="850" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 816) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="898" font-size="28" fill="#192644">Separate Shivaji&apos;s administrative</text><text x="769" y="936" font-size="28" fill="#192644">institutions from the</text><text x="769" y="974" font-size="28" fill="#192644">eighteenth-century political</text><text x="769" y="1012" font-size="28" fill="#192644">arrangements of the Maratha</text><text x="769" y="1050" font-size="28" fill="#192644">confederacy.</text><rect x="48" y="1119" width="659" height="220" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="1140" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="1172" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 1138) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1220" font-size="28" fill="#192644">Why did hill forts matter to Shivaji&apos;s</text><text x="84" y="1258" font-size="28" fill="#192644">state?</text><rect x="733" y="1119" width="659" height="220" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="1140" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="1172" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 1138) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1220" font-size="28" fill="#192644">They defended routes, stored supplies</text><text x="769" y="1258" font-size="28" fill="#192644">and gave mobile forces secure bases in</text><text x="769" y="1296" font-size="28" fill="#192644">difficult terrain.</text><rect x="48" y="1365" width="1344" height="144" rx="23" fill="#eef2ff" stroke="#bcccf0" stroke-width="2"/><rect x="77" y="1386" width="253" height="46" rx="18" fill="#bcccf0"/><text x="93" y="1418" font-size="31" fill="#17243f" font-weight="700">Quick revision</text><g transform="translate(1306 1384) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="1466" font-size="28" fill="#192644">Raigad → 1674 coronation. Ashtapradhan → eight senior offices. Chauth → one quarter.</text></g></svg>
