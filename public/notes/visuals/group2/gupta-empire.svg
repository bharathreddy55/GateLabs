<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1709" viewBox="0 0 1440 1709"><rect width="1440" height="1709" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M10 58 H110 M21 58 V26 M58 58 V14 M96 58 V35"/><circle cx="21" cy="58" r="5"/><circle cx="58" cy="58" r="5"/><circle cx="96" cy="58" r="5"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Gupta Empire</text><path d="M50 175 Q210 184 372 175" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="214" font-size="26" fill="#394978" font-weight="700">APPSC Group 2 Prelims  •  Indian History</text><rect x="48" y="247" width="1344" height="524" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="268" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="300" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 266) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="348" font-size="28" fill="#192644">The Gupta dynasty rose in northern India in the fourth century CE. Chandragupta I&apos;s</text><text x="84" y="386" font-size="28" fill="#192644">marriage to Kumaradevi linked the dynasty with the Licchavis. Harishena&apos;s Prayaga</text><text x="84" y="424" font-size="28" fill="#192644">Prashasti celebrates Samudragupta&apos;s military campaigns. Chandragupta II expanded</text><text x="84" y="462" font-size="28" fill="#192644">into western India and defeated the Western Kshatrapas. Provincial and district</text><text x="84" y="500" font-size="28" fill="#192644">officials, subordinate rulers and land grantees all appear in records.</text><text x="84" y="538" font-size="28" fill="#192644">Agriculture, commerce and craft production supported the economy. Gold coins show</text><text x="84" y="576" font-size="28" fill="#192644">royal imagery and elite patronage. Land grants could transfer revenue claims and</text><text x="84" y="614" font-size="28" fill="#192644">reveal ties between rulers, Brahmanas and religious institutions. Sanskrit court</text><text x="84" y="652" font-size="28" fill="#192644">literature flourished, and Kalidasa is associated with the classical period. Hindu,</text><text x="84" y="690" font-size="28" fill="#192644">Buddhist and Jain establishments coexisted. Deogarh&apos;s Dashavatara temple and</text><text x="84" y="728" font-size="28" fill="#192644">Gupta-period sculptures from Sarnath show different traditions of religious art.</text><rect x="48" y="797" width="659" height="372" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="818" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="850" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 816) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="898" font-size="28" fill="#192644">A question lists defeated northern</text><text x="84" y="936" font-size="28" fill="#192644">rulers and southern rulers who were</text><text x="84" y="974" font-size="28" fill="#192644">restored after submission. The pattern</text><text x="84" y="1012" font-size="28" fill="#192644">matches the Prayaga Prashasti&apos;s</text><text x="84" y="1050" font-size="28" fill="#192644">account of Samudragupta and</text><text x="84" y="1088" font-size="28" fill="#192644">illustrates different strategies of</text><text x="84" y="1126" font-size="28" fill="#192644">rule.</text><rect x="733" y="797" width="659" height="372" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="818" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="850" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 816) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="898" font-size="28" fill="#192644">The expression “golden age” usually</text><text x="769" y="936" font-size="28" fill="#192644">describes selected cultural</text><text x="769" y="974" font-size="28" fill="#192644">achievements. Use separate evidence</text><text x="769" y="1012" font-size="28" fill="#192644">for the living conditions of different</text><text x="769" y="1050" font-size="28" fill="#192644">groups.</text><rect x="48" y="1195" width="659" height="258" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="1216" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="1248" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 1214) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1296" font-size="28" fill="#192644">What kind of source is the Prayaga</text><text x="84" y="1334" font-size="28" fill="#192644">Prashasti?</text><rect x="733" y="1195" width="659" height="258" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="1216" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="1248" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 1214) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1296" font-size="28" fill="#192644">A Sanskrit royal eulogy. It offers</text><text x="769" y="1334" font-size="28" fill="#192644">evidence of political claims and</text><text x="769" y="1372" font-size="28" fill="#192644">campaigns and uses praise as part of</text><text x="769" y="1410" font-size="28" fill="#192644">its genre.</text><rect x="48" y="1479" width="1344" height="182" rx="23" fill="#eef2ff" stroke="#bcccf0" stroke-width="2"/><rect x="77" y="1500" width="253" height="46" rx="18" fill="#bcccf0"/><text x="93" y="1532" font-size="31" fill="#17243f" font-weight="700">Quick revision</text><g transform="translate(1306 1498) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="1580" font-size="28" fill="#192644">Harishena composed the Prayaga Prashasti. Chandragupta II defeated the Western</text><text x="84" y="1618" font-size="28" fill="#192644">Kshatrapas. Compare coins, land grants and inscriptions.</text></g></svg>
