<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1273" viewBox="0 0 1440 1273"><rect width="1440" height="1273" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M4 67 L33 23 L56 54 L79 11 L114 67 Z M65 37 L79 11 L93 36 M24 39 L33 23 L44 38"/><circle cx="100" cy="18" r="8"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Child Labour</text><path d="M50 175 Q210 184 372 175" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="214" font-size="26" fill="#394978" font-weight="700">APPSC Group 2 Prelims  •  Indian Society</text><rect x="48" y="247" width="1344" height="334" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="268" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="300" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 266) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="348" font-size="28" fill="#192644">Child labour can interrupt schooling, threaten health and reinforce poverty. The Child</text><text x="84" y="386" font-size="28" fill="#192644">and Adolescent Labour Act generally prohibits employment of children under 14, subject</text><text x="84" y="424" font-size="28" fill="#192644">to statutory exceptions, and prohibits adolescents aged 14 to under 18 from specified</text><text x="84" y="462" font-size="28" fill="#192644">hazardous occupations and processes. Article 24 bars employment of children below 14</text><text x="84" y="500" font-size="28" fill="#192644">in factories, mines and other hazardous employment. Education, household income</text><text x="84" y="538" font-size="28" fill="#192644">support and inspection can address different causes.</text><rect x="48" y="607" width="659" height="334" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="628" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="660" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 626) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="708" font-size="28" fill="#192644">An item describes a 16-year-old working</text><text x="84" y="746" font-size="28" fill="#192644">in a prohibited hazardous process. The</text><text x="84" y="784" font-size="28" fill="#192644">adolescent restriction applies. If the</text><text x="84" y="822" font-size="28" fill="#192644">person were under 14, the broader child</text><text x="84" y="860" font-size="28" fill="#192644">employment restrictions would also</text><text x="84" y="898" font-size="28" fill="#192644">need consideration.</text><rect x="733" y="607" width="659" height="334" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="628" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="660" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 626) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="708" font-size="28" fill="#192644">Age definitions differ across statutes.</text><text x="769" y="746" font-size="28" fill="#192644">For labour questions distinguish the</text><text x="769" y="784" font-size="28" fill="#192644">child and adolescent bands used by the</text><text x="769" y="822" font-size="28" fill="#192644">applicable Act.</text><rect x="48" y="967" width="659" height="258" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="988" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="1020" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 986) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1068" font-size="28" fill="#192644">Why can school enrolment alone miss</text><text x="84" y="1106" font-size="28" fill="#192644">child labour?</text><rect x="733" y="967" width="659" height="258" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="988" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="1020" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 986) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1068" font-size="28" fill="#192644">A child may be enrolled while working</text><text x="769" y="1106" font-size="28" fill="#192644">outside school hours, experiencing</text><text x="769" y="1144" font-size="28" fill="#192644">irregular attendance or leaving before</text><text x="769" y="1182" font-size="28" fill="#192644">completion.</text></g></svg>
