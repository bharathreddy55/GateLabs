<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1259" viewBox="0 0 1440 1259"><rect width="1440" height="1259" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M4 67 L33 23 L56 54 L79 11 L114 67 Z M65 37 L79 11 L93 36 M24 39 L33 23 L44 38"/><circle cx="100" cy="18" r="8"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Constitutional and Statutory Safeguards for</text><text x="48" y="212" font-size="56" fill="#182342" font-weight="700">Minorities</text><path d="M50 237 Q210 246 372 237" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="276" font-size="26" fill="#394978" font-weight="700">APPSC Group 2 Prelims  •  Indian Society</text><rect x="48" y="309" width="1344" height="372" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="330" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="362" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 328) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="410" font-size="28" fill="#192644">Articles 25–28 address religious freedom and related matters. Article 29(1) protects</text><text x="84" y="448" font-size="28" fill="#192644">the right of any section of citizens with a distinct language, script or culture to</text><text x="84" y="486" font-size="28" fill="#192644">conserve it. Article 30(1) gives religious and linguistic minorities the right to</text><text x="84" y="524" font-size="28" fill="#192644">establish and administer educational institutions of their choice. Article 350A</text><text x="84" y="562" font-size="28" fill="#192644">concerns efforts to provide adequate mother-tongue instruction facilities at the</text><text x="84" y="600" font-size="28" fill="#192644">primary stage for children of linguistic minorities. The National Commission for</text><text x="84" y="638" font-size="28" fill="#192644">Minorities has a statutory basis.</text><rect x="48" y="707" width="659" height="296" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="728" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="760" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 726) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="808" font-size="28" fill="#192644">An item asks about a linguistic minority</text><text x="84" y="846" font-size="28" fill="#192644">establishing and administering an</text><text x="84" y="884" font-size="28" fill="#192644">educational institution. Article 30(1) is</text><text x="84" y="922" font-size="28" fill="#192644">the direct match. Preservation of a</text><text x="84" y="960" font-size="28" fill="#192644">distinct script points to Article 29(1).</text><rect x="733" y="707" width="659" height="296" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="728" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="760" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 726) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="808" font-size="28" fill="#192644">Keep Article 29(1)&apos;s wording in view. It</text><text x="769" y="846" font-size="28" fill="#192644">refers to a section of citizens with a</text><text x="769" y="884" font-size="28" fill="#192644">distinct language, script or culture.</text><rect x="48" y="1029" width="659" height="182" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="1050" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="1082" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 1048) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1130" font-size="28" fill="#192644">What two types of minorities are</text><text x="84" y="1168" font-size="28" fill="#192644">expressly named in Article 30(1)?</text><rect x="733" y="1029" width="659" height="182" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="1050" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="1082" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 1048) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1130" font-size="28" fill="#192644">Minorities based on religion or</text><text x="769" y="1168" font-size="28" fill="#192644">language.</text></g></svg>
