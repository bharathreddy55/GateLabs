<svg xmlns="http://www.w3.org/2000/svg" width="480" height="721" viewBox="0 0 480 721" role="img" aria-labelledby="title description">
<title id="title">Levers and Simple Machines — Quick revision</title>
<desc id="description">Balance the moments about the pivot: effort × arm = load × arm. Load, 120 N at 10 cm Moment, 1,200 N·cm 30 cm arm, effort = 40 N Watch for: Use the perpendicular distance from the pivot.</desc>
<rect x="0" y="0" width="480" height="721" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBT</text>
<text x="18" y="78" font-size="33" fill="#172540">Levers and Simple</text>
<text x="18" y="121" font-size="33" fill="#172540">Machines</text>
<rect x="18" y="154" width="444" height="112" rx="12" fill="#dcefe8"/>
<text x="32" y="179" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="209" font-size="24" fill="#172540">Balance the moments about the</text>
<text x="32" y="242" font-size="24" fill="#172540">pivot: effort × arm = load × arm.</text>
<text x="18" y="302" font-size="17" fill="#435579">QUICK EXAMPLE</text>
<g transform="translate(18 308)" aria-hidden="true"><path d="M78 51H366 M151 51l-18 32h36z" fill="none" stroke="#435579" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M85 14V42m-5-6 5 6 5-6 M354 14V42m-5-6 5 6 5-6" fill="none" stroke="#126558" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="103" y="28" font-size="19" fill="#126558">120 N</text><text x="340" y="28" font-size="19" fill="#126558" text-anchor="middle">40 N</text><text x="102" y="101" font-size="18" fill="#435579" text-anchor="middle">10 cm</text><text x="255" y="101" font-size="18" fill="#435579" text-anchor="middle">30 cm</text></g>
<rect x="18" y="431" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="460" font-size="17" fill="#435579">Load</text>
<text x="186" y="461" font-size="21" fill="#172540">120 N at 10 cm</text>
<rect x="18" y="486" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="515" font-size="17" fill="#435579">Moment</text>
<text x="186" y="516" font-size="21" fill="#172540">1,200 N·cm</text>
<rect x="18" y="541" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="570" font-size="17" fill="#435579">30 cm arm</text>
<text x="186" y="571" font-size="21" fill="#172540">effort = 40 N</text>
<rect x="18" y="606" width="444" height="97" rx="12" fill="#f9e9c9"/>
<text x="32" y="630" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="656" font-size="19" fill="#172540">Use the perpendicular distance from the</text>
<text x="32" y="683" font-size="19" fill="#172540">pivot.</text>
</g>
</svg>
