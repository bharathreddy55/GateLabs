<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1045" viewBox="0 0 1440 1045"><rect width="1440" height="1045" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M7 70 V11 M7 70 H110 M19 60 L44 44 L62 50 L94 22" /><circle cx="44" cy="44" r="4"/><circle cx="94" cy="22" r="4"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Levers and Simple Machines</text><path d="M50 175 Q210 184 372 175" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="214" font-size="26" fill="#394978" font-weight="700">RRB Station Master CBT  •  Basic Science and Mathematics</text><rect x="48" y="247" width="1344" height="296" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="268" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="300" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 266) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="348" font-size="28" fill="#192644">A lever rotates about a fulcrum. Torque magnitude is force times perpendicular</text><text x="84" y="386" font-size="28" fill="#192644">distance from the axis. For equilibrium, clockwise and anticlockwise torques balance.</text><text x="84" y="424" font-size="28" fill="#192644">Simple machines, including levers, pulleys and inclined planes, trade effort force</text><text x="84" y="462" font-size="28" fill="#192644">against distance in the ideal case. Real machines lose energy to friction and</text><text x="84" y="500" font-size="28" fill="#192644">deformation.</text><rect x="48" y="569" width="659" height="220" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="590" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="622" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 588) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="670" font-size="28" fill="#192644">A load of 60 N acts 0.2 m from a pivot.</text><text x="84" y="708" font-size="28" fill="#192644">At a perpendicular effort arm of 0.6 m,</text><text x="84" y="746" font-size="28" fill="#192644">balance requires 60×0.2/0.6=20 N.</text><rect x="733" y="569" width="659" height="220" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="590" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="622" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 588) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="670" font-size="28" fill="#192644">Use the perpendicular moment arm, not</text><text x="769" y="708" font-size="28" fill="#192644">simply any distance between the point</text><text x="769" y="746" font-size="28" fill="#192644">of application and the pivot.</text><rect x="48" y="815" width="659" height="182" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="836" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="868" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 834) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="916" font-size="28" fill="#192644">Why does an ideal longer ramp require</text><text x="84" y="954" font-size="28" fill="#192644">less force to raise the same mass?</text><rect x="733" y="815" width="659" height="182" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="836" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="868" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 834) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="916" font-size="28" fill="#192644">The work to gain height is spread over a</text><text x="769" y="954" font-size="28" fill="#192644">longer travel distance.</text></g></svg>
