<svg xmlns="http://www.w3.org/2000/svg" width="480" height="721" viewBox="0 0 480 721" role="img" aria-labelledby="title description">
<title id="title">Data Analysis from Pie Charts — Quick revision</title>
<desc id="description">Count = total × sector angle ÷ 360°. Whole, 400 tickets Slice, 90° = ¼ Count, 100 tickets Watch for: Comparing counts across pies requires both totals.</desc>
<rect x="0" y="0" width="480" height="721" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBT</text>
<text x="18" y="78" font-size="33" fill="#172540">Data Analysis from Pie</text>
<text x="18" y="121" font-size="33" fill="#172540">Charts</text>
<rect x="18" y="154" width="444" height="112" rx="12" fill="#dcefe8"/>
<text x="32" y="179" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="209" font-size="24" fill="#172540">Count = total × sector angle ÷</text>
<text x="32" y="242" font-size="24" fill="#172540">360°.</text>
<text x="18" y="302" font-size="17" fill="#435579">QUICK EXAMPLE</text>
<g transform="translate(18 308)" aria-hidden="true"><circle cx="151" cy="55" r="44" fill="#dce6f5"/><path d="M151 55V11A44 44 0 0 1 195 55Z" fill="#80cdb1"/><text x="215" y="53" font-size="23" fill="#126558">90° = ¼</text><text x="215" y="81" font-size="18" fill="#435579">¼ of 400 tickets</text></g>
<rect x="18" y="431" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="460" font-size="17" fill="#435579">Whole</text>
<text x="186" y="461" font-size="21" fill="#172540">400 tickets</text>
<rect x="18" y="486" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="515" font-size="17" fill="#435579">Slice</text>
<text x="186" y="516" font-size="21" fill="#172540">90° = ¼</text>
<rect x="18" y="541" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="570" font-size="17" fill="#435579">Count</text>
<text x="186" y="571" font-size="21" fill="#172540">100 tickets</text>
<rect x="18" y="606" width="444" height="97" rx="12" fill="#f9e9c9"/>
<text x="32" y="630" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="656" font-size="19" fill="#172540">Comparing counts across pies requires</text>
<text x="32" y="683" font-size="19" fill="#172540">both totals.</text>
</g>
</svg>
