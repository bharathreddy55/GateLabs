<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-labelledby="title description">
<title id="title">Rankings — Quick revision</title>
<desc id="description">Opposite-end rank = total + 1 − known rank. People, 48 B, 12th from right From left, 49 − 12 = 37th Watch for: Count between two ranks with the same reference end.</desc>
<rect x="0" y="0" width="480" height="560" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBT</text>
<text x="18" y="78" font-size="33" fill="#172540">Rankings</text>
<rect x="18" y="111" width="444" height="112" rx="12" fill="#dcefe8"/>
<text x="32" y="136" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="166" font-size="24" fill="#172540">Opposite-end rank = total + 1 −</text>
<text x="32" y="199" font-size="24" fill="#172540">known rank.</text>
<text x="18" y="259" font-size="17" fill="#435579">QUICK EXAMPLE</text>

<rect x="18" y="270" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="299" font-size="17" fill="#435579">People</text>
<text x="186" y="300" font-size="21" fill="#172540">48</text>
<rect x="18" y="325" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="354" font-size="17" fill="#435579">B</text>
<text x="186" y="355" font-size="21" fill="#172540">12th from right</text>
<rect x="18" y="380" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="409" font-size="17" fill="#435579">From left</text>
<text x="186" y="410" font-size="21" fill="#172540">49 − 12 = 37th</text>
<rect x="18" y="445" width="444" height="97" rx="12" fill="#f9e9c9"/>
<text x="32" y="469" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="495" font-size="19" fill="#172540">Count between two ranks with the same</text>
<text x="32" y="522" font-size="19" fill="#172540">reference end.</text>
</g>
</svg>
