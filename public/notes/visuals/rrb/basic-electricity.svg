<svg xmlns="http://www.w3.org/2000/svg" width="480" height="697" viewBox="0 0 480 697" role="img" aria-labelledby="title description">
<title id="title">Basic Electricity — Quick revision</title>
<desc id="description">V = IR. Series shares current. Parallel shares voltage. 6 Ω ∥ 3 Ω, across 12 V Branch currents, 2 A and 4 A Supply, 6 A; total R = 2 Ω Watch for: Parallel resistance is below the smallest branch resistance.</desc>
<rect x="0" y="0" width="480" height="697" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBT</text>
<text x="18" y="78" font-size="33" fill="#172540">Basic Electricity</text>
<rect x="18" y="111" width="444" height="112" rx="12" fill="#dcefe8"/>
<text x="32" y="136" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="166" font-size="24" fill="#172540">V = IR. Series shares current.</text>
<text x="32" y="199" font-size="24" fill="#172540">Parallel shares voltage.</text>
<text x="18" y="259" font-size="17" fill="#435579">QUICK EXAMPLE</text>
<g transform="translate(18 265)" aria-hidden="true"><path d="M90 51h50 M140 51V24H191 M140 51V82H191 M253 24H304V82H253 M304 51h50" fill="none" stroke="#435579" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="191" y="11" width="62" height="28" rx="6" fill="#b8e2d3"/><rect x="191" y="69" width="62" height="28" rx="6" fill="#b8e2d3"/><text x="222" y="32" font-size="19" fill="#126558" text-anchor="middle">6 Ω</text><text x="222" y="90" font-size="19" fill="#126558" text-anchor="middle">3 Ω</text><circle cx="140" cy="51" r="4" fill="#435579"/><circle cx="304" cy="51" r="4" fill="#435579"/><text x="268" y="17" font-size="18" fill="#435579">2 A</text><text x="268" y="106" font-size="18" fill="#435579">4 A</text></g>
<rect x="18" y="388" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="417" font-size="17" fill="#435579">6 Ω ∥ 3 Ω</text>
<text x="186" y="418" font-size="21" fill="#172540">across 12 V</text>
<rect x="18" y="443" width="444" height="69" rx="9" fill="#e9edf6"/>
<text x="32" y="472" font-size="17" fill="#435579">Branch</text>
<text x="32" y="496" font-size="17" fill="#435579">currents</text>
<text x="186" y="473" font-size="21" fill="#172540">2 A and 4 A</text>
<rect x="18" y="517" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="546" font-size="17" fill="#435579">Supply</text>
<text x="186" y="547" font-size="21" fill="#172540">6 A; total R = 2 Ω</text>
<rect x="18" y="582" width="444" height="97" rx="12" fill="#f9e9c9"/>
<text x="32" y="606" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="632" font-size="19" fill="#172540">Parallel resistance is below the smallest</text>
<text x="32" y="659" font-size="19" fill="#172540">branch resistance.</text>
</g>
</svg>
