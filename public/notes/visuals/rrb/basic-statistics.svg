<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-labelledby="title description">
<title id="title">Basic Statistics — Quick revision</title>
<desc id="description">Mean uses every value. Median uses the middle rank. Ordered data, 2, 4, 6, 8, 30 Mean, 50 ÷ 5 = 10 Median, 6 Watch for: Sort first. With even n, average the middle two.</desc>
<rect x="0" y="0" width="480" height="560" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBT</text>
<text x="18" y="78" font-size="33" fill="#172540">Basic Statistics</text>
<rect x="18" y="111" width="444" height="112" rx="12" fill="#dcefe8"/>
<text x="32" y="136" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="166" font-size="24" fill="#172540">Mean uses every value. Median</text>
<text x="32" y="199" font-size="24" fill="#172540">uses the middle rank.</text>
<text x="18" y="259" font-size="17" fill="#435579">QUICK EXAMPLE</text>

<rect x="18" y="270" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="299" font-size="17" fill="#435579">Ordered data</text>
<text x="186" y="300" font-size="21" fill="#172540">2, 4, 6, 8, 30</text>
<rect x="18" y="325" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="354" font-size="17" fill="#435579">Mean</text>
<text x="186" y="355" font-size="21" fill="#172540">50 ÷ 5 = 10</text>
<rect x="18" y="380" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="409" font-size="17" fill="#435579">Median</text>
<text x="186" y="410" font-size="21" fill="#172540">6</text>
<rect x="18" y="445" width="444" height="97" rx="12" fill="#f9e9c9"/>
<text x="32" y="469" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="495" font-size="19" fill="#172540">Sort first. With even n, average the</text>
<text x="32" y="522" font-size="19" fill="#172540">middle two.</text>
</g>
</svg>
