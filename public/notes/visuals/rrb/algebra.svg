<svg xmlns="http://www.w3.org/2000/svg" width="480" height="527" viewBox="0 0 480 527" role="img" aria-labelledby="title description">
<title id="title">Algebraic Expressions — Quick revision</title>
<desc id="description">(a + b)² = a² + 2ab + b². Given, x + y = 10 Square, x² + 2xy + y² = 100 If xy = 21, x² + y² = 58 Watch for: Cancel common factors across a fraction.</desc>
<rect x="0" y="0" width="480" height="527" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBT</text>
<text x="18" y="78" font-size="33" fill="#172540">Algebraic Expressions</text>
<rect x="18" y="111" width="444" height="79" rx="12" fill="#dcefe8"/>
<text x="32" y="136" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="166" font-size="24" fill="#172540">(a + b)² = a² + 2ab + b².</text>
<text x="18" y="226" font-size="17" fill="#435579">QUICK EXAMPLE</text>

<rect x="18" y="237" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="266" font-size="17" fill="#435579">Given</text>
<text x="186" y="267" font-size="21" fill="#172540">x + y = 10</text>
<rect x="18" y="292" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="321" font-size="17" fill="#435579">Square</text>
<text x="186" y="322" font-size="21" fill="#172540">x² + 2xy + y² = 100</text>
<rect x="18" y="347" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="376" font-size="17" fill="#435579">If xy = 21</text>
<text x="186" y="377" font-size="21" fill="#172540">x² + y² = 58</text>
<rect x="18" y="412" width="444" height="97" rx="12" fill="#f9e9c9"/>
<text x="32" y="436" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="462" font-size="19" fill="#172540">Cancel common factors across a</text>
<text x="32" y="489" font-size="19" fill="#172540">fraction.</text>
</g>
</svg>
