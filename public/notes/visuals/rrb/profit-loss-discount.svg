<svg xmlns="http://www.w3.org/2000/svg" width="480" height="576" viewBox="0 0 480 576" role="img" aria-labelledby="title description">
<title id="title">Profit, Loss and Discounts — Quick revision</title>
<desc id="description">Profit % uses cost price. Discount % uses marked price. Cost, ₹100 Marked, ₹150 Sell (−20%), ₹120 Watch for: ₹20 profit is 20% of the ₹100 cost.</desc>
<rect x="0" y="0" width="480" height="576" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBT</text>
<text x="18" y="78" font-size="33" fill="#172540">Profit, Loss and</text>
<text x="18" y="121" font-size="33" fill="#172540">Discounts</text>
<rect x="18" y="154" width="444" height="112" rx="12" fill="#dcefe8"/>
<text x="32" y="179" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="209" font-size="24" fill="#172540">Profit % uses cost price.</text>
<text x="32" y="242" font-size="24" fill="#172540">Discount % uses marked price.</text>
<text x="18" y="302" font-size="17" fill="#435579">QUICK EXAMPLE</text>

<rect x="18" y="313" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="342" font-size="17" fill="#435579">Cost</text>
<text x="186" y="343" font-size="21" fill="#172540">₹100</text>
<rect x="18" y="368" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="397" font-size="17" fill="#435579">Marked</text>
<text x="186" y="398" font-size="21" fill="#172540">₹150</text>
<rect x="18" y="423" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="452" font-size="17" fill="#435579">Sell (−20%)</text>
<text x="186" y="453" font-size="21" fill="#172540">₹120</text>
<rect x="18" y="488" width="444" height="70" rx="12" fill="#f9e9c9"/>
<text x="32" y="512" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="538" font-size="19" fill="#172540">₹20 profit is 20% of the ₹100 cost.</text>
</g>
</svg>
