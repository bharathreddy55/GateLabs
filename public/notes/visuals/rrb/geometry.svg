<svg xmlns="http://www.w3.org/2000/svg" width="480" height="593" viewBox="0 0 480 593" role="img" aria-labelledby="title description">
<title id="title">Plane Geometry — Quick revision</title>
<desc id="description">Similar triangles have area ratio equal to the square of their side ratio. Side ratio, 2 : 3 Square both, 2² : 3² Area ratio, 4 : 9 Watch for: Match corresponding sides before forming ratios.</desc>
<rect x="0" y="0" width="480" height="593" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBT</text>
<text x="18" y="78" font-size="33" fill="#172540">Plane Geometry</text>
<rect x="18" y="111" width="444" height="145" rx="12" fill="#dcefe8"/>
<text x="32" y="136" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="166" font-size="24" fill="#172540">Similar triangles have area ratio</text>
<text x="32" y="199" font-size="24" fill="#172540">equal to the square of their</text>
<text x="32" y="232" font-size="24" fill="#172540">side ratio.</text>
<text x="18" y="292" font-size="17" fill="#435579">QUICK EXAMPLE</text>

<rect x="18" y="303" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="332" font-size="17" fill="#435579">Side ratio</text>
<text x="186" y="333" font-size="21" fill="#172540">2 : 3</text>
<rect x="18" y="358" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="387" font-size="17" fill="#435579">Square both</text>
<text x="186" y="388" font-size="21" fill="#172540">2² : 3²</text>
<rect x="18" y="413" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="442" font-size="17" fill="#435579">Area ratio</text>
<text x="186" y="443" font-size="21" fill="#172540">4 : 9</text>
<rect x="18" y="478" width="444" height="97" rx="12" fill="#f9e9c9"/>
<text x="32" y="502" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="528" font-size="19" fill="#172540">Match corresponding sides before</text>
<text x="32" y="555" font-size="19" fill="#172540">forming ratios.</text>
</g>
</svg>
