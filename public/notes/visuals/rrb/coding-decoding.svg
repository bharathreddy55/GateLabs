<svg xmlns="http://www.w3.org/2000/svg" width="480" height="593" viewBox="0 0 480 593" role="img" aria-labelledby="title description">
<title id="title">Coding and Decoding — Quick revision</title>
<desc id="description">Track the order: rearrange first if the prompt says so, then shift. Original, RAIL Reverse, LIAR +1, −1, +1, −1, MHBQ Watch for: Odd/even positions may change after reversal.</desc>
<rect x="0" y="0" width="480" height="593" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBT</text>
<text x="18" y="78" font-size="33" fill="#172540">Coding and Decoding</text>
<rect x="18" y="111" width="444" height="145" rx="12" fill="#dcefe8"/>
<text x="32" y="136" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="166" font-size="24" fill="#172540">Track the order: rearrange</text>
<text x="32" y="199" font-size="24" fill="#172540">first if the prompt says so,</text>
<text x="32" y="232" font-size="24" fill="#172540">then shift.</text>
<text x="18" y="292" font-size="17" fill="#435579">QUICK EXAMPLE</text>

<rect x="18" y="303" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="332" font-size="17" fill="#435579">Original</text>
<text x="186" y="333" font-size="21" fill="#172540">RAIL</text>
<rect x="18" y="358" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="387" font-size="17" fill="#435579">Reverse</text>
<text x="186" y="388" font-size="21" fill="#172540">LIAR</text>
<rect x="18" y="413" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="442" font-size="17" fill="#435579">+1, −1, +1, −1</text>
<text x="186" y="443" font-size="21" fill="#172540">MHBQ</text>
<rect x="18" y="478" width="444" height="97" rx="12" fill="#f9e9c9"/>
<text x="32" y="502" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="528" font-size="19" fill="#172540">Odd/even positions may change after</text>
<text x="32" y="555" font-size="19" fill="#172540">reversal.</text>
</g>
</svg>
