<svg xmlns="http://www.w3.org/2000/svg" width="480" height="566" viewBox="0 0 480 566" role="img" aria-labelledby="title description">
<title id="title">Letter Series — Quick revision</title>
<desc id="description">Number A to Z, and check separate columns in letter groups. First column, B → E → H → K Second column, C → F → I → L Both +3, next group NO Watch for: Wrap after Z when the rule supports it.</desc>
<rect x="0" y="0" width="480" height="566" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBT</text>
<text x="18" y="78" font-size="33" fill="#172540">Letter Series</text>
<rect x="18" y="111" width="444" height="145" rx="12" fill="#dcefe8"/>
<text x="32" y="136" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="166" font-size="24" fill="#172540">Number A to Z, and check</text>
<text x="32" y="199" font-size="24" fill="#172540">separate columns in letter</text>
<text x="32" y="232" font-size="24" fill="#172540">groups.</text>
<text x="18" y="292" font-size="17" fill="#435579">QUICK EXAMPLE</text>

<rect x="18" y="303" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="332" font-size="17" fill="#435579">First column</text>
<text x="186" y="333" font-size="21" fill="#172540">B → E → H → K</text>
<rect x="18" y="358" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="387" font-size="17" fill="#435579">Second column</text>
<text x="186" y="388" font-size="21" fill="#172540">C → F → I → L</text>
<rect x="18" y="413" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="442" font-size="17" fill="#435579">Both +3</text>
<text x="186" y="443" font-size="21" fill="#172540">next group NO</text>
<rect x="18" y="478" width="444" height="70" rx="12" fill="#f9e9c9"/>
<text x="32" y="502" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="528" font-size="19" fill="#172540">Wrap after Z when the rule supports it.</text>
</g>
</svg>
