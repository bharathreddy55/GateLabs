<svg xmlns="http://www.w3.org/2000/svg" width="480" height="645" viewBox="0 0 480 645" role="img" aria-labelledby="title description">
<title id="title">Venn Diagrams — Quick revision</title>
<desc id="description">At least one = A + B − both. Group A, 10 only + 5 both Group B, 7 only + 5 both Union, 10 + 5 + 7 = 22 Watch for: Count the overlap once. Neither lies outside both.</desc>
<rect x="0" y="0" width="480" height="645" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBT</text>
<text x="18" y="78" font-size="33" fill="#172540">Venn Diagrams</text>
<rect x="18" y="111" width="444" height="79" rx="12" fill="#dcefe8"/>
<text x="32" y="136" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="166" font-size="24" fill="#172540">At least one = A + B − both.</text>
<text x="18" y="226" font-size="17" fill="#435579">QUICK EXAMPLE</text>
<g transform="translate(18 232)" aria-hidden="true"><circle cx="190" cy="55" r="53" fill="#dce6f5"/><circle cx="252" cy="55" r="53" fill="#b8e2d3"/><path d="M221 12 A53 53 0 0 1 221 98 A53 53 0 0 1 221 12Z" fill="#80cdb1"/><text x="172" y="63" font-size="24" fill="#435579" text-anchor="middle">10</text><text x="221" y="63" font-size="24" fill="#126558" text-anchor="middle">5</text><text x="274" y="63" font-size="24" fill="#126558" text-anchor="middle">7</text><text x="126" y="24" font-size="19" fill="#435579">A</text><text x="310" y="24" font-size="19" fill="#126558">B</text></g>
<rect x="18" y="355" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="384" font-size="17" fill="#435579">Group A</text>
<text x="186" y="385" font-size="21" fill="#172540">10 only + 5 both</text>
<rect x="18" y="410" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="439" font-size="17" fill="#435579">Group B</text>
<text x="186" y="440" font-size="21" fill="#172540">7 only + 5 both</text>
<rect x="18" y="465" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="494" font-size="17" fill="#435579">Union</text>
<text x="186" y="495" font-size="21" fill="#172540">10 + 5 + 7 = 22</text>
<rect x="18" y="530" width="444" height="97" rx="12" fill="#f9e9c9"/>
<text x="32" y="554" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="580" font-size="19" fill="#172540">Count the overlap once. Neither lies</text>
<text x="32" y="607" font-size="19" fill="#172540">outside both.</text>
</g>
</svg>
