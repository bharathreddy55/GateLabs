<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1007" viewBox="0 0 1440 1007"><rect width="1440" height="1007" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><path d="M7 70 V11 M7 70 H110 M19 60 L44 44 L62 50 L94 22" /><circle cx="44" cy="44" r="4"/><circle cx="94" cy="22" r="4"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Ratio and Proportion</text><path d="M50 175 Q210 184 372 175" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="214" font-size="26" fill="#394978" font-weight="700">RRB Station Master CBT  •  Basic Science and Mathematics</text><rect x="48" y="247" width="1344" height="220" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="268" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="300" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 266) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="348" font-size="28" fill="#192644">A ratio compares quantities multiplicatively. Dividing a total in ratio a:b gives shares</text><text x="84" y="386" font-size="28" fill="#192644">a/(a+b) and b/(a+b). In direct proportion y/x stays constant. In inverse proportion xy</text><text x="84" y="424" font-size="28" fill="#192644">stays constant under the problem&apos;s assumptions.</text><rect x="48" y="493" width="659" height="220" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="514" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="546" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 512) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="594" font-size="28" fill="#192644">Split ₹1,250 in ratio 2:3. There are five</text><text x="84" y="632" font-size="28" fill="#192644">parts worth ₹250 each. The shares are</text><text x="84" y="670" font-size="28" fill="#192644">₹500 and ₹750.</text><rect x="733" y="493" width="659" height="220" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="514" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="546" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 512) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="594" font-size="28" fill="#192644">Convert mixed units before forming a</text><text x="769" y="632" font-size="28" fill="#192644">ratio. A part-to-part ratio differs</text><text x="769" y="670" font-size="28" fill="#192644">from a part-to-whole fraction.</text><rect x="48" y="739" width="659" height="220" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="760" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="792" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 758) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="840" font-size="28" fill="#192644">Six identical taps fill a tank in 10 hours.</text><text x="84" y="878" font-size="28" fill="#192644">Four work at the same individual rate.</text><text x="84" y="916" font-size="28" fill="#192644">How long do they take?</text><rect x="733" y="739" width="659" height="220" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="760" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="792" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 758) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="840" font-size="28" fill="#192644">15 hours, with total work equal to 60</text><text x="769" y="878" font-size="28" fill="#192644">tap-hours and four taps operating.</text></g></svg>
