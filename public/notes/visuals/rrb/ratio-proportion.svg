<svg xmlns="http://www.w3.org/2000/svg" width="480" height="533" viewBox="0 0 480 533" role="img" aria-labelledby="title description">
<title id="title">Ratio and Proportion — Quick revision</title>
<desc id="description">To split a total, divide by the sum of the ratio parts. Ratio, 3 : 2 Total, ₹600 ÷ 5 = ₹120 Two shares, ₹360 and ₹240 Watch for: Make both quantities use the same unit.</desc>
<rect x="0" y="0" width="480" height="533" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBT</text>
<text x="18" y="78" font-size="33" fill="#172540">Ratio and Proportion</text>
<rect x="18" y="111" width="444" height="112" rx="12" fill="#dcefe8"/>
<text x="32" y="136" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="166" font-size="24" fill="#172540">To split a total, divide by the</text>
<text x="32" y="199" font-size="24" fill="#172540">sum of the ratio parts.</text>
<text x="18" y="259" font-size="17" fill="#435579">QUICK EXAMPLE</text>

<rect x="18" y="270" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="299" font-size="17" fill="#435579">Ratio</text>
<text x="186" y="300" font-size="21" fill="#172540">3 : 2</text>
<rect x="18" y="325" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="354" font-size="17" fill="#435579">Total</text>
<text x="186" y="355" font-size="21" fill="#172540">₹600 ÷ 5 = ₹120</text>
<rect x="18" y="380" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="409" font-size="17" fill="#435579">Two shares</text>
<text x="186" y="410" font-size="21" fill="#172540">₹360 and ₹240</text>
<rect x="18" y="445" width="444" height="70" rx="12" fill="#f9e9c9"/>
<text x="32" y="469" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="495" font-size="19" fill="#172540">Make both quantities use the same unit.</text>
</g>
</svg>
