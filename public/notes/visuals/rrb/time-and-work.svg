<svg xmlns="http://www.w3.org/2000/svg" width="480" height="533" viewBox="0 0 480 533" role="img" aria-labelledby="title description">
<title id="title">Time and Work — Quick revision</title>
<desc id="description">Add work rates. Subtract a leak or drain. A in 6 days, 2 units/day B in 12 days, 1 unit/day 12-unit job, 12 ÷ 3 = 4 days Watch for: Add output per day, then invert for time.</desc>
<rect x="0" y="0" width="480" height="533" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBT</text>
<text x="18" y="78" font-size="33" fill="#172540">Time and Work</text>
<rect x="18" y="111" width="444" height="112" rx="12" fill="#dcefe8"/>
<text x="32" y="136" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="166" font-size="24" fill="#172540">Add work rates. Subtract a leak</text>
<text x="32" y="199" font-size="24" fill="#172540">or drain.</text>
<text x="18" y="259" font-size="17" fill="#435579">QUICK EXAMPLE</text>

<rect x="18" y="270" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="299" font-size="17" fill="#435579">A in 6 days</text>
<text x="186" y="300" font-size="21" fill="#172540">2 units/day</text>
<rect x="18" y="325" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="354" font-size="17" fill="#435579">B in 12 days</text>
<text x="186" y="355" font-size="21" fill="#172540">1 unit/day</text>
<rect x="18" y="380" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="409" font-size="17" fill="#435579">12-unit job</text>
<text x="186" y="410" font-size="21" fill="#172540">12 ÷ 3 = 4 days</text>
<rect x="18" y="445" width="444" height="70" rx="12" fill="#f9e9c9"/>
<text x="32" y="469" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="495" font-size="19" fill="#172540">Add output per day, then invert for time.</text>
</g>
</svg>
