<svg xmlns="http://www.w3.org/2000/svg" width="480" height="711" viewBox="0 0 480 711" role="img" aria-labelledby="title description">
<title id="title">Statistical Distributions — Quick revision</title>
<desc id="description">For a frequency-density histogram, frequency = width × height. Bin A, 5 × 4 = 20 Bin B, 10 × 3 = 30 Larger count, B Watch for: Unequal bin widths make heights alone misleading.</desc>
<rect x="0" y="0" width="480" height="711" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBT</text>
<text x="18" y="78" font-size="33" fill="#172540">Statistical Distributions</text>
<rect x="18" y="111" width="444" height="145" rx="12" fill="#dcefe8"/>
<text x="32" y="136" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="166" font-size="24" fill="#172540">For a frequency-density</text>
<text x="32" y="199" font-size="24" fill="#172540">histogram, frequency = width ×</text>
<text x="32" y="232" font-size="24" fill="#172540">height.</text>
<text x="18" y="292" font-size="17" fill="#435579">QUICK EXAMPLE</text>
<g transform="translate(18 298)" aria-hidden="true"><path d="M109 16V92H349" fill="none" stroke="#435579" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="136" y="24" width="60" height="68" rx="0" fill="#dce6f5"/><rect x="196" y="41" width="120" height="51" rx="0" fill="#8fd4bc"/><text x="166" y="65" font-size="22" fill="#435579" text-anchor="middle">20</text><text x="256" y="73" font-size="22" fill="#126558" text-anchor="middle">30</text><text x="166" y="113" font-size="18" fill="#435579" text-anchor="middle">Width 5</text><text x="256" y="113" font-size="18" fill="#435579" text-anchor="middle">Width 10</text></g>
<rect x="18" y="421" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="450" font-size="17" fill="#435579">Bin A</text>
<text x="186" y="451" font-size="21" fill="#172540">5 × 4 = 20</text>
<rect x="18" y="476" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="505" font-size="17" fill="#435579">Bin B</text>
<text x="186" y="506" font-size="21" fill="#172540">10 × 3 = 30</text>
<rect x="18" y="531" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="560" font-size="17" fill="#435579">Larger count</text>
<text x="186" y="561" font-size="21" fill="#172540">B</text>
<rect x="18" y="596" width="444" height="97" rx="12" fill="#f9e9c9"/>
<text x="32" y="620" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="646" font-size="19" fill="#172540">Unequal bin widths make heights alone</text>
<text x="32" y="673" font-size="19" fill="#172540">misleading.</text>
</g>
</svg>
