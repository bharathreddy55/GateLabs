<svg xmlns="http://www.w3.org/2000/svg" width="480" height="622" viewBox="0 0 480 622" role="img" aria-labelledby="title description">
<title id="title">Mass, Weight and Density — Quick revision</title>
<desc id="description">Weight = mg. Density = mass ÷ volume. Object, 2 kg, 1 L Weight at g = 10, 20 N Density, 2 kg/L Watch for: Mass stays fixed when local gravity changes.</desc>
<rect x="0" y="0" width="480" height="622" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBT</text>
<text x="18" y="78" font-size="33" fill="#172540">Mass, Weight and</text>
<text x="18" y="121" font-size="33" fill="#172540">Density</text>
<rect x="18" y="154" width="444" height="112" rx="12" fill="#dcefe8"/>
<text x="32" y="179" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="209" font-size="24" fill="#172540">Weight = mg. Density = mass ÷</text>
<text x="32" y="242" font-size="24" fill="#172540">volume.</text>
<text x="18" y="302" font-size="17" fill="#435579">QUICK EXAMPLE</text>

<rect x="18" y="313" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="342" font-size="17" fill="#435579">Object</text>
<text x="186" y="343" font-size="21" fill="#172540">2 kg, 1 L</text>
<rect x="18" y="368" width="444" height="69" rx="9" fill="#e9edf6"/>
<text x="32" y="397" font-size="17" fill="#435579">Weight at g =</text>
<text x="32" y="421" font-size="17" fill="#435579">10</text>
<text x="186" y="398" font-size="21" fill="#172540">20 N</text>
<rect x="18" y="442" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="471" font-size="17" fill="#435579">Density</text>
<text x="186" y="472" font-size="21" fill="#172540">2 kg/L</text>
<rect x="18" y="507" width="444" height="97" rx="12" fill="#f9e9c9"/>
<text x="32" y="531" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="557" font-size="19" fill="#172540">Mass stays fixed when local gravity</text>
<text x="32" y="584" font-size="19" fill="#172540">changes.</text>
</g>
</svg>
