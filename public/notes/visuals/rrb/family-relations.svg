<svg xmlns="http://www.w3.org/2000/svg" width="480" height="603" viewBox="0 0 480 603" role="img" aria-labelledby="title description">
<title id="title">Problems Relating to Relations — Quick revision</title>
<desc id="description">Answer from the viewpoint of the person named after “to”. Start, R R’s mother, Q Q’s brother, P, maternal uncle Watch for: Mark gender only when a clue establishes it.</desc>
<rect x="0" y="0" width="480" height="603" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBT</text>
<text x="18" y="78" font-size="33" fill="#172540">Problems Relating to</text>
<text x="18" y="121" font-size="33" fill="#172540">Relations</text>
<rect x="18" y="154" width="444" height="112" rx="12" fill="#dcefe8"/>
<text x="32" y="179" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="209" font-size="24" fill="#172540">Answer from the viewpoint of</text>
<text x="32" y="242" font-size="24" fill="#172540">the person named after “to”.</text>
<text x="18" y="302" font-size="17" fill="#435579">QUICK EXAMPLE</text>

<rect x="18" y="313" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="342" font-size="17" fill="#435579">Start</text>
<text x="186" y="343" font-size="21" fill="#172540">R</text>
<rect x="18" y="368" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="397" font-size="17" fill="#435579">R’s mother</text>
<text x="186" y="398" font-size="21" fill="#172540">Q</text>
<rect x="18" y="423" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="452" font-size="17" fill="#435579">Q’s brother</text>
<text x="186" y="453" font-size="21" fill="#172540">P, maternal uncle</text>
<rect x="18" y="488" width="444" height="97" rx="12" fill="#f9e9c9"/>
<text x="32" y="512" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="538" font-size="19" fill="#172540">Mark gender only when a clue establishes</text>
<text x="32" y="565" font-size="19" fill="#172540">it.</text>
</g>
</svg>
