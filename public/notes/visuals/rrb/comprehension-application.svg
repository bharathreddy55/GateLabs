<svg xmlns="http://www.w3.org/2000/svg" width="480" height="603" viewBox="0 0 480 603" role="img" aria-labelledby="title description">
<title id="title">Reading Comprehension — Application and Inference — Quick revision</title>
<desc id="description">Carry the passage rule and all its conditions into the new case. Rule, reserve + shut door New case, reserved; door open Result, condition unmet Watch for: An inference needs evidence from the passage.</desc>
<rect x="0" y="0" width="480" height="603" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBT</text>
<text x="18" y="78" font-size="33" fill="#172540">Reading Comprehension —</text>
<text x="18" y="121" font-size="33" fill="#172540">Application and Inference</text>
<rect x="18" y="154" width="444" height="112" rx="12" fill="#dcefe8"/>
<text x="32" y="179" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="209" font-size="24" fill="#172540">Carry the passage rule and all</text>
<text x="32" y="242" font-size="24" fill="#172540">its conditions into the new case.</text>
<text x="18" y="302" font-size="17" fill="#435579">QUICK EXAMPLE</text>

<rect x="18" y="313" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="342" font-size="17" fill="#435579">Rule</text>
<text x="186" y="343" font-size="21" fill="#172540">reserve + shut door</text>
<rect x="18" y="368" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="397" font-size="17" fill="#435579">New case</text>
<text x="186" y="398" font-size="21" fill="#172540">reserved; door open</text>
<rect x="18" y="423" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="452" font-size="17" fill="#435579">Result</text>
<text x="186" y="453" font-size="21" fill="#172540">condition unmet</text>
<rect x="18" y="488" width="444" height="97" rx="12" fill="#f9e9c9"/>
<text x="32" y="512" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="538" font-size="19" fill="#172540">An inference needs evidence from the</text>
<text x="32" y="565" font-size="19" fill="#172540">passage.</text>
</g>
</svg>
