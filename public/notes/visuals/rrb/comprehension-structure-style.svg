<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1183" viewBox="0 0 1440 1183"><rect width="1440" height="1183" fill="#fffaf4"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="48" y="46" width="204" height="42" rx="20" fill="#f9df9a"/><text x="65" y="74" font-size="17" fill="#523f24" font-weight="700">VISUAL STUDY GUIDE</text><g transform="translate(1201 52) scale(1.37)" stroke="#55418a" stroke-width="3.8" fill="#f0e8fb" stroke-linejoin="round" stroke-linecap="round"><rect x="4" y="28" width="26" height="26" rx="5"/><rect x="46" y="12" width="26" height="26" rx="5"/><rect x="86" y="42" width="26" height="26" rx="5"/><path d="M30 33 L46 25 M71 34 L87 47 M40 24 L46 25 L44 31 M84 40 L87 47 L80 46"/></g><text x="48" y="150" font-size="56" fill="#182342" font-weight="700">Reading Comprehension — Logical Structure</text><text x="48" y="212" font-size="56" fill="#182342" font-weight="700">and Style</text><path d="M50 237 Q210 246 372 237" stroke="#e4ad2b" stroke-width="7" fill="none" stroke-linecap="round"/><text x="49" y="276" font-size="26" fill="#394978" font-weight="700">RRB Station Master CBT  •  Logical Capability</text><rect x="48" y="309" width="1344" height="258" rx="23" fill="#f3edff" stroke="#d8bbfa" stroke-width="2"/><rect x="77" y="330" width="258" height="46" rx="18" fill="#d8bbfa"/><text x="93" y="362" font-size="31" fill="#17243f" font-weight="700">Core concepts</text><g transform="translate(1306 328) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 Q20 7 32 14 Q44 7 59 12 V49 Q43 45 32 52 Q20 45 5 49 Z M32 14 V52 M12 23 Q22 21 26 25 M38 25 Q43 21 52 23"/></g><text x="84" y="410" font-size="28" fill="#192644">Track connective words and sentence functions. In contrast introduces a difference,</text><text x="84" y="448" font-size="28" fill="#192644">for example supplies an illustration, and therefore signals an inference. Distinguish</text><text x="84" y="486" font-size="28" fill="#192644">description, explanation, persuasion and satire using the author&apos;s word choice and</text><text x="84" y="524" font-size="28" fill="#192644">argumentative moves.</text><rect x="48" y="593" width="659" height="296" rx="23" fill="#e9f6ff" stroke="#b0dcf6" stroke-width="2"/><rect x="77" y="614" width="287" height="46" rx="18" fill="#b0dcf6"/><text x="93" y="646" font-size="31" fill="#17243f" font-weight="700">Worked example</text><g transform="translate(621 612) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="40" rx="8"/><path d="M17 34 H45 M36 25 L45 34 L36 43 M20 8 H44"/></g><text x="84" y="694" font-size="28" fill="#192644">A paragraph introduces water scarcity,</text><text x="84" y="732" font-size="28" fill="#192644">gives two causes, compares policies and</text><text x="84" y="770" font-size="28" fill="#192644">endorses one. The structure is problem,</text><text x="84" y="808" font-size="28" fill="#192644">causes, alternatives and</text><text x="84" y="846" font-size="28" fill="#192644">recommendation.</text><rect x="733" y="593" width="659" height="296" rx="23" fill="#ffedf0" stroke="#f4bcc8" stroke-width="2"/><rect x="762" y="614" width="296" height="46" rx="18" fill="#f4bcc8"/><text x="778" y="646" font-size="31" fill="#17243f" font-weight="700">Common mistake</text><g transform="translate(1306 612) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8 L60 54 H4 Z M32 23 V37 M32 45 H32.5"/></g><text x="769" y="694" font-size="28" fill="#192644">Distinguish tone from topic. A serious</text><text x="769" y="732" font-size="28" fill="#192644">topic can be discussed in a neutral</text><text x="769" y="770" font-size="28" fill="#192644">analytical tone.</text><rect x="48" y="915" width="659" height="220" rx="23" fill="#edf8e9" stroke="#bfe8b7" stroke-width="2"/><rect x="77" y="936" width="125" height="46" rx="18" fill="#bfe8b7"/><text x="93" y="968" font-size="31" fill="#17243f" font-weight="700">Try it</text><g transform="translate(621 934) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M22 24 C23 10 48 16 43 27 C41 34 32 33 32 41 M32 48 H32.5"/></g><text x="84" y="1016" font-size="28" fill="#192644">What does nevertheless often signal?</text><rect x="733" y="915" width="659" height="220" rx="23" fill="#fff5d9" stroke="#f5d889" stroke-width="2"/><rect x="762" y="936" width="332" height="46" rx="18" fill="#f5d889"/><text x="778" y="968" font-size="31" fill="#17243f" font-weight="700">Check your answer</text><g transform="translate(1306 934) scale(0.72)" fill="none" stroke="#344468" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M19 33 L28 42 L46 23"/></g><text x="769" y="1016" font-size="28" fill="#192644">A qualification or contrast with what</text><text x="769" y="1054" font-size="28" fill="#192644">the preceding sentence leads the</text><text x="769" y="1092" font-size="28" fill="#192644">reader to expect.</text></g></svg>
