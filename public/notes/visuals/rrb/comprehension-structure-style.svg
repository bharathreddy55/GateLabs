<svg xmlns="http://www.w3.org/2000/svg" width="480" height="679" viewBox="0 0 480 679" role="img" aria-labelledby="title description">
<title id="title">Reading Comprehension — Logical Structure and Style — Quick revision</title>
<desc id="description">Map what each sentence does: claim, contrast, evidence or result. Benefit, updates are consistent However, they can lag Therefore, keep a manual backup Watch for: Support a tone choice with the writer’s words.</desc>
<rect x="0" y="0" width="480" height="679" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBT</text>
<text x="18" y="78" font-size="33" fill="#172540">Reading Comprehension —</text>
<text x="18" y="121" font-size="33" fill="#172540">Logical Structure and</text>
<text x="18" y="164" font-size="33" fill="#172540">Style</text>
<rect x="18" y="197" width="444" height="145" rx="12" fill="#dcefe8"/>
<text x="32" y="222" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="252" font-size="24" fill="#172540">Map what each sentence does:</text>
<text x="32" y="285" font-size="24" fill="#172540">claim, contrast, evidence or</text>
<text x="32" y="318" font-size="24" fill="#172540">result.</text>
<text x="18" y="378" font-size="17" fill="#435579">QUICK EXAMPLE</text>

<rect x="18" y="389" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="418" font-size="17" fill="#435579">Benefit</text>
<text x="186" y="419" font-size="21" fill="#172540">updates are consistent</text>
<rect x="18" y="444" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="473" font-size="17" fill="#435579">However</text>
<text x="186" y="474" font-size="21" fill="#172540">they can lag</text>
<rect x="18" y="499" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="528" font-size="17" fill="#435579">Therefore</text>
<text x="186" y="529" font-size="21" fill="#172540">keep a manual backup</text>
<rect x="18" y="564" width="444" height="97" rx="12" fill="#f9e9c9"/>
<text x="32" y="588" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="614" font-size="19" fill="#172540">Support a tone choice with the writer’s</text>
<text x="32" y="641" font-size="19" fill="#172540">words.</text>
</g>
</svg>
