<svg xmlns="http://www.w3.org/2000/svg" width="480" height="704" viewBox="0 0 480 704" role="img" aria-labelledby="title description">
<title id="title">Reading Comprehension — Main and Supporting Ideas — Quick revision</title>
<desc id="description">Main idea = topic + the author’s central claim. Topic, park lighting Evidence, glare and insect activity Main point, shield lights and limit spill Watch for: A memorable detail may cover just one sentence.</desc>
<rect x="0" y="0" width="480" height="704" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBT</text>
<text x="18" y="78" font-size="33" fill="#172540">Reading Comprehension —</text>
<text x="18" y="121" font-size="33" fill="#172540">Main and Supporting</text>
<text x="18" y="164" font-size="33" fill="#172540">Ideas</text>
<rect x="18" y="197" width="444" height="112" rx="12" fill="#dcefe8"/>
<text x="32" y="222" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="252" font-size="24" fill="#172540">Main idea = topic + the author’s</text>
<text x="32" y="285" font-size="24" fill="#172540">central claim.</text>
<text x="18" y="345" font-size="17" fill="#435579">QUICK EXAMPLE</text>

<rect x="18" y="356" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="385" font-size="17" fill="#435579">Topic</text>
<text x="186" y="386" font-size="21" fill="#172540">park lighting</text>
<rect x="18" y="411" width="444" height="79" rx="9" fill="#e9edf6"/>
<text x="32" y="440" font-size="17" fill="#435579">Evidence</text>
<text x="186" y="441" font-size="21" fill="#172540">glare and insect</text>
<text x="186" y="470" font-size="21" fill="#172540">activity</text>
<rect x="18" y="495" width="444" height="79" rx="9" fill="#dcefe8"/>
<text x="32" y="524" font-size="17" fill="#435579">Main point</text>
<text x="186" y="525" font-size="21" fill="#172540">shield lights and limit</text>
<text x="186" y="554" font-size="21" fill="#172540">spill</text>
<rect x="18" y="589" width="444" height="97" rx="12" fill="#f9e9c9"/>
<text x="32" y="613" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="639" font-size="19" fill="#172540">A memorable detail may cover just one</text>
<text x="32" y="666" font-size="19" fill="#172540">sentence.</text>
</g>
</svg>
