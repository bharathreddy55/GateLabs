<svg xmlns="http://www.w3.org/2000/svg" width="480" height="636" viewBox="0 0 480 636" role="img" aria-labelledby="title description">
<title id="title">Seating and Ordering Arrangements — Quick revision</title>
<desc id="description">In an evenly spaced circle, the opposite seat is N ÷ 2 steps away. Start, A in a 6-seat circle Opposite, B, 3 steps clockwise Next clockwise, C, 4 steps from A Watch for: Facing out reverses personal left and right.</desc>
<rect x="0" y="0" width="480" height="636" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBT</text>
<text x="18" y="78" font-size="33" fill="#172540">Seating and Ordering</text>
<text x="18" y="121" font-size="33" fill="#172540">Arrangements</text>
<rect x="18" y="154" width="444" height="145" rx="12" fill="#dcefe8"/>
<text x="32" y="179" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="209" font-size="24" fill="#172540">In an evenly spaced circle, the</text>
<text x="32" y="242" font-size="24" fill="#172540">opposite seat is N ÷ 2 steps</text>
<text x="32" y="275" font-size="24" fill="#172540">away.</text>
<text x="18" y="335" font-size="17" fill="#435579">QUICK EXAMPLE</text>

<rect x="18" y="346" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="375" font-size="17" fill="#435579">Start</text>
<text x="186" y="376" font-size="21" fill="#172540">A in a 6-seat circle</text>
<rect x="18" y="401" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="430" font-size="17" fill="#435579">Opposite</text>
<text x="186" y="431" font-size="21" fill="#172540">B, 3 steps clockwise</text>
<rect x="18" y="456" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="485" font-size="17" fill="#435579">Next clockwise</text>
<text x="186" y="486" font-size="21" fill="#172540">C, 4 steps from A</text>
<rect x="18" y="521" width="444" height="97" rx="12" fill="#f9e9c9"/>
<text x="32" y="545" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="571" font-size="19" fill="#172540">Facing out reverses personal left and</text>
<text x="32" y="598" font-size="19" fill="#172540">right.</text>
</g>
</svg>
