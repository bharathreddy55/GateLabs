<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960"><rect width="1440" height="960" fill="#fffaf4"/><g font-family="Arial,sans-serif" fill="#192644"><text x="720" y="98" text-anchor="middle" font-size="69" font-weight="700">Work, Power and Energy</text><text x="720" y="148" text-anchor="middle" font-size="25">RRB Station Master CBT • Visual Study Guide</text><path d="M460 117 Q720 129 980 117" fill="none" stroke="#f2bb33" stroke-width="8" stroke-linecap="round"/><g stroke="#c6cbdc" stroke-width="2"><rect x="44" y="190" width="432" height="390" rx="27" fill="#f1edff"/><rect x="504" y="190" width="432" height="390" rx="27" fill="#e7f5ff"/><rect x="964" y="190" width="432" height="390" rx="27" fill="#e8f8ee"/><rect x="44" y="612" width="663" height="297" rx="27" fill="#fff0d4"/><rect x="733" y="612" width="663" height="297" rx="27" fill="#ffe9ef"/></g><g font-size="39" font-weight="700"><text x="78" y="250">Work</text><text x="538" y="250">Power</text><text x="998" y="250">Energy</text><text x="78" y="677">Worked example</text><text x="767" y="677">Check your intuition</text></g><g font-size="25"><text x="78" y="301">Force acting through displacement</text><text x="538" y="301">How quickly work is done</text><text x="998" y="301">Energy changes with motion or height</text><text x="78" y="550">Unit: joule (J)</text><text x="538" y="550">Unit: watt (W) = J/s</text><text x="998" y="550">Net work = change in kinetic energy</text><text x="78" y="725">50 N pushes a crate 4 m in 5 s.</text><text x="767" y="725">Holding a crate still takes effort.</text><text x="767" y="767">Its displacement is zero, so the</text><text x="767" y="807">mechanical work on it is zero.</text><text x="767" y="858">Twice the speed gives four times the kinetic energy.</text></g><rect x="185" y="354" width="104" height="85" rx="7" fill="#edac61" stroke="#583b30" stroke-width="5"/><path d="M189 432 L285 361 M305 395 H415 M394 379 L415 395 L394 411" stroke="#963f3a" stroke-width="6" fill="none" stroke-linecap="round"/><text x="327" y="374" font-size="22">Force</text><path d="M95 443 H422" stroke="#334565" stroke-width="4"/><circle cx="720" cy="398" r="52" fill="#fff" stroke="#38588a" stroke-width="6"/><path d="M720 365 V398 L749 410 M700 333 H740" stroke="#38588a" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M1000 444 H1290 L1348 357 H1010" fill="#cbebd6" stroke="#326651" stroke-width="4"/><circle cx="1240" cy="341" r="19" fill="#e9ab54" stroke="#6a472f" stroke-width="4"/><path d="M1195 341 H1135 M1213 325 H1165" stroke="#326651" stroke-width="4"/><g font-size="34" font-weight="700"><text x="78" y="511">W = F × s × cos θ</text><text x="538" y="511">P = W ÷ t</text><text x="998" y="511">K = ½mv²   •   ΔU = mgΔh</text><text x="78" y="781">W = 50 × 4 = 200 J</text><text x="78" y="845">P = 200 ÷ 5 = 40 W</text></g></g></svg>
