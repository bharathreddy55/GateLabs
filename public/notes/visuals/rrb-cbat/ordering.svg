<svg xmlns="http://www.w3.org/2000/svg" width="480" height="593" viewBox="0 0 480 593" role="img" aria-labelledby="title description">
<title id="title">Information Ordering — Quick revision</title>
<desc id="description">Place fixed slots, keep immediate neighbours together, then check gaps. Fixed, T is last Linked, M immediately before P Example, K → R → M → P → T Watch for: One task between means a difference of two slots.</desc>
<rect x="0" y="0" width="480" height="593" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBAT</text>
<text x="18" y="78" font-size="33" fill="#172540">Information Ordering</text>
<rect x="18" y="111" width="444" height="145" rx="12" fill="#dcefe8"/>
<text x="32" y="136" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="166" font-size="24" fill="#172540">Place fixed slots, keep immediate</text>
<text x="32" y="199" font-size="24" fill="#172540">neighbours together, then</text>
<text x="32" y="232" font-size="24" fill="#172540">check gaps.</text>
<text x="18" y="292" font-size="17" fill="#435579">QUICK EXAMPLE</text>

<rect x="18" y="303" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="332" font-size="17" fill="#435579">Fixed</text>
<text x="186" y="333" font-size="21" fill="#172540">T is last</text>
<rect x="18" y="358" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="387" font-size="17" fill="#435579">Linked</text>
<text x="186" y="388" font-size="21" fill="#172540">M immediately before P</text>
<rect x="18" y="413" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="442" font-size="17" fill="#435579">Example</text>
<text x="186" y="443" font-size="21" fill="#172540">K → R → M → P → T</text>
<rect x="18" y="478" width="444" height="97" rx="12" fill="#f9e9c9"/>
<text x="32" y="502" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="528" font-size="19" fill="#172540">One task between means a difference of</text>
<text x="32" y="555" font-size="19" fill="#172540">two slots.</text>
</g>
</svg>
