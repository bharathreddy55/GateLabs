<svg xmlns="http://www.w3.org/2000/svg" width="480" height="593" viewBox="0 0 480 593" role="img" aria-labelledby="title description">
<title id="title">Selective Attention — Quick revision</title>
<desc id="description">Filter the target digits first. Then perform the operation named. Scan, 7 8 7 2 3 Keep odds, 7 + 7 + 3 Sum, 17 Watch for: Every repeated target contributes again.</desc>
<rect x="0" y="0" width="480" height="593" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBAT</text>
<text x="18" y="78" font-size="33" fill="#172540">Selective Attention</text>
<rect x="18" y="111" width="444" height="145" rx="12" fill="#dcefe8"/>
<text x="32" y="136" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="166" font-size="24" fill="#172540">Filter the target digits first.</text>
<text x="32" y="199" font-size="24" fill="#172540">Then perform the operation</text>
<text x="32" y="232" font-size="24" fill="#172540">named.</text>
<text x="18" y="292" font-size="17" fill="#435579">QUICK EXAMPLE</text>

<rect x="18" y="303" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="332" font-size="17" fill="#435579">Scan</text>
<text x="186" y="333" font-size="21" fill="#172540">7 8 7 2 3</text>
<rect x="18" y="358" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="387" font-size="17" fill="#435579">Keep odds</text>
<text x="186" y="388" font-size="21" fill="#172540">7 + 7 + 3</text>
<rect x="18" y="413" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="442" font-size="17" fill="#435579">Sum</text>
<text x="186" y="443" font-size="21" fill="#172540">17</text>
<rect x="18" y="478" width="444" height="97" rx="12" fill="#f9e9c9"/>
<text x="32" y="502" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="528" font-size="19" fill="#172540">Every repeated target contributes</text>
<text x="32" y="555" font-size="19" fill="#172540">again.</text>
</g>
</svg>
