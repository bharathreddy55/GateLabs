<svg xmlns="http://www.w3.org/2000/svg" width="480" height="622" viewBox="0 0 480 622" role="img" aria-labelledby="title description">
<title id="title">Personality — Quick revision</title>
<desc id="description">Read the response scale and answer for your usual behaviour. Prompt, “I ask for clarification” Consider, typical situations Respond, match your experience Watch for: Agreement and frequency scales ask different things.</desc>
<rect x="0" y="0" width="480" height="622" rx="20" fill="#faf7ee"/>
<g font-family="Segoe UI, Arial, sans-serif" font-weight="700">
<text x="18" y="33" font-size="17" fill="#126558">STATION MASTER  ·  CBAT</text>
<text x="18" y="78" font-size="33" fill="#172540">Personality</text>
<rect x="18" y="111" width="444" height="145" rx="12" fill="#dcefe8"/>
<text x="32" y="136" font-size="17" fill="#126558">KEY RULE</text>
<text x="32" y="166" font-size="24" fill="#172540">Read the response scale and</text>
<text x="32" y="199" font-size="24" fill="#172540">answer for your usual</text>
<text x="32" y="232" font-size="24" fill="#172540">behaviour.</text>
<text x="18" y="292" font-size="17" fill="#435579">QUICK EXAMPLE</text>

<rect x="18" y="303" width="444" height="79" rx="9" fill="#e9edf6"/>
<text x="32" y="332" font-size="17" fill="#435579">Prompt</text>
<text x="186" y="333" font-size="21" fill="#172540">“I ask for</text>
<text x="186" y="362" font-size="21" fill="#172540">clarification”</text>
<rect x="18" y="387" width="444" height="50" rx="9" fill="#e9edf6"/>
<text x="32" y="416" font-size="17" fill="#435579">Consider</text>
<text x="186" y="417" font-size="21" fill="#172540">typical situations</text>
<rect x="18" y="442" width="444" height="50" rx="9" fill="#dcefe8"/>
<text x="32" y="471" font-size="17" fill="#435579">Respond</text>
<text x="186" y="472" font-size="21" fill="#172540">match your experience</text>
<rect x="18" y="507" width="444" height="97" rx="12" fill="#f9e9c9"/>
<text x="32" y="531" font-size="17" fill="#83530e">WATCH FOR</text>
<text x="32" y="557" font-size="19" fill="#172540">Agreement and frequency scales ask</text>
<text x="32" y="584" font-size="19" fill="#172540">different things.</text>
</g>
</svg>
